<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#897b72">
  <title>學生自主練習｜Sherry Aerial</title>
  <link rel="icon" href="assets/app-icon-192.png">
  <style>
    :root{--ink:#403a36;--muted:#786f69;--paper:#f7f3ed;--card:#fffdf9;--taupe:#897b72;--line:#ded4ca;--rose:#ead8d4;--blue:#dbe5e6;--blue-ink:#52686b;--danger:#9b5d62;--shadow:0 10px 30px rgba(84,69,60,.08)}
    *{box-sizing:border-box}html{background:var(--paper)}body{margin:0;color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif;background:linear-gradient(180deg,#f1ebe4 0,#f7f3ed 210px);min-height:100vh}
    button,input,select,textarea{font:inherit}.app{width:min(760px,100%);margin:auto;padding:0 18px 52px}.topbar{height:76px;margin:0 -18px;padding:env(safe-area-inset-top) 20px 0;display:flex;align-items:center;gap:12px;background:rgba(132,118,109,.97);color:#fff;position:sticky;top:0;z-index:5;box-shadow:0 1px rgba(255,255,255,.2)}.logo{width:42px;height:42px;border-radius:12px}.brand{display:grid;gap:1px}.brand strong{font-size:16px}.brand span{font-size:11px;opacity:.78}.hero{padding:34px 4px 22px;border-bottom:1px solid var(--line)}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:#9a6f66}.hero h1{font-size:34px;line-height:1.12;margin:6px 0 10px}.hero p{color:var(--muted);margin:0;line-height:1.6}.controls{display:grid;grid-template-columns:1fr;gap:12px;margin:20px 0}.field{display:grid;gap:7px;font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:13px 14px;outline:0}.field input:focus,.field select:focus,.field textarea:focus{border-color:#b99c93;box-shadow:0 0 0 3px rgba(185,156,147,.16)}.rooms{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.room-tab{border:1px solid var(--line);background:rgba(255,253,249,.72);border-radius:14px;padding:10px 4px;color:var(--muted);display:grid;gap:2px}.room-tab b{font-size:18px}.room-tab span{font-size:10px}.room-tab.active{background:var(--card);border-color:#c6a79e;color:var(--ink);box-shadow:var(--shadow)}.legend{display:flex;align-items:center;gap:14px;margin:18px 2px 10px;color:var(--muted);font-size:12px}.legend i{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:5px;background:var(--rose)}.legend span+span i{background:#9db2b4}.slots{display:grid;gap:11px}.slot-card{width:100%;text-align:left;border:1px solid var(--line);border-left:5px solid #caa9a1;border-radius:18px;background:var(--card);padding:16px 17px;display:grid;grid-template-columns:1fr auto;gap:5px 14px;color:var(--ink);box-shadow:0 3px 12px rgba(70,56,48,.04)}.slot-card.shared{border-left-color:#8da6a9;background:#fbfdfc}.slot-time{grid-column:1;color:#8e6d65;font-size:13px;font-weight:800}.slot-card strong{grid-column:1;font-size:16px;line-height:1.4}.slot-meta{grid-column:1;color:var(--muted);font-size:12px}.slot-action{grid-column:2;grid-row:1/4;align-self:center;color:#765f58;font-size:12px;font-weight:800}.slot-action i{font-style:normal;font-size:20px}.notice{display:none;margin:12px 0;border-radius:13px;padding:12px 14px;font-size:13px;line-height:1.5}.notice.visible{display:block;background:#eee8e2}.notice.error{background:#f3dfe0;color:#874d52}.empty-state{border:1px dashed #cfc4ba;border-radius:18px;padding:36px 18px;text-align:center;display:grid;gap:8px;background:rgba(255,255,255,.4)}.empty-state span{color:var(--muted);font-size:13px}.loading-card{height:112px;border-radius:18px;background:linear-gradient(90deg,#eee7df,#f8f4ef,#eee7df);background-size:220% 100%;animation:pulse 1.3s infinite}@keyframes pulse{to{background-position:-220% 0}}.policy{margin:24px 0 0;padding:17px;border-radius:17px;background:#eee8e2;color:#6d645e;font-size:13px;line-height:1.65}.policy b{color:var(--ink)}dialog{border:0;border-radius:22px;padding:0;width:min(450px,calc(100% - 28px));background:var(--card);color:var(--ink);box-shadow:0 25px 80px rgba(51,42,37,.25)}dialog::backdrop{background:rgba(48,40,36,.46);backdrop-filter:blur(2px)}.dialog-body{padding:23px}.dialog-body h2{font-size:22px;margin:0 0 5px}.dialog-summary{background:#f4efe9;border-radius:13px;padding:11px 12px;color:var(--muted);font-size:13px;margin:13px 0 18px}.identity{display:grid;grid-template-columns:1fr;gap:10px}.dialog-actions{display:grid;grid-template-columns:1fr 1.55fr;gap:9px;margin-top:18px}.btn{border:1px solid var(--line);border-radius:13px;padding:13px;font-weight:800;background:var(--card);color:var(--ink)}.btn.primary{background:var(--taupe);border-color:var(--taupe);color:white}.success-mark{width:54px;height:54px;border-radius:50%;background:var(--blue);color:var(--blue-ink);display:grid;place-items:center;font-size:27px;margin-bottom:14px}.success-copy{color:var(--muted);line-height:1.65}.full{grid-column:1/-1}.fineprint{font-size:11px;color:var(--muted);line-height:1.5;margin:10px 0 0}
    @media(min-width:620px){.app{padding-left:24px;padding-right:24px}.topbar{margin-left:-24px;margin-right:-24px;padding-left:26px}.controls{grid-template-columns:220px 1fr;align-items:end}.slots{grid-template-columns:1fr 1fr}.slot-card{min-height:132px}.hero h1{font-size:40px}}
  </style>
</head>
<body>
  <main class="app">
    <header class="topbar"><img class="logo" src="assets/app-icon-192.png" alt=""><div class="brand"><strong>Sherry Aerial Studio</strong><span>學生自主練習</span></div></header>
    <section class="hero"><span class="eyebrow">Student Practice</span><h1>選擇自主練習時間</h1><p>僅顯示目前可登記的教室空檔。</p></section>
    <section class="controls"><label class="field">日期<input id="practice-date" type="date" aria-label="自主練習日期"></label><div id="rooms" class="rooms" aria-label="教室"></div></section>
    <div id="notice" class="notice" role="status" aria-live="polite"></div>
    <div class="legend"><span><i></i>空教室</span><span><i></i>可一起使用</span></div>
    <section id="slots" class="slots" aria-live="polite"></section>
    <aside class="policy"><b>登記前請注意</b><br>最晚請於開始前 2 小時完成登記。第一次使用可能需由老師確認自主練習資格；取消或換時間請洽官方 LINE，請勿重複登記。</aside>
  </main>

  <dialog id="booking-dialog"><form id="booking-form" class="dialog-body"><h2 id="dialog-title">登記自主練習</h2><div id="dialog-summary" class="dialog-summary"></div><div id="identity-fields" class="identity"><label class="field">APP 名稱<input id="app-name" autocomplete="name" placeholder="請輸入 APP 內的姓名"></label><label class="field">APP 內註冊 Email<input id="app-email" type="email" autocomplete="email" placeholder="name@example.com"></label><p class="fineprint full">請填寫 APP 內使用的姓名與註冊 Email，供老師確認資格。</p></div><label id="start-field" class="field">開始時間<select id="start-time"></select></label><label id="duration-field" class="field">練習時長<select id="duration"></select></label><label class="field">備註（選填）<textarea id="student-note" rows="2" placeholder="例如：需要鞦韆"></textarea></label><div class="dialog-actions"><button id="close-booking" class="btn" type="button">返回</button><button id="submit-booking" class="btn primary" type="submit">確認送出</button></div></form></dialog>
  <dialog id="success-dialog"><div class="dialog-body"><div class="success-mark">✓</div><h2 id="success-title">登記已成立</h2><p id="success-copy" class="success-copy"></p><button id="close-success" class="btn primary" type="button" style="width:100%">我知道了</button></div></dialog>
  <script src="student-practice.js"></script>
</body>
</html>
