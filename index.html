<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry Aerial | 教室管理</title>
  <style>
    :root {
      --ink: #1f292b;
      --muted: #647174;
      --line: #d9e0e1;
      --surface: #ffffff;
      --page: #edf2f2;
      --soft: #f5f8f8;
      --accent: #24656a;
      --accent-hover: #194e52;
      --accent-soft: #e4f1f1;
      --warm: #9a5a13;
      --warm-soft: #fff4e5;
      --danger: #a33a32;
      --danger-soft: #fceceb;
      --success: #2d6845;
      --success-soft: #e9f5ed;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", sans-serif;
      letter-spacing: 0;
    }

    button, input { font: inherit; }
    button { touch-action: manipulation; }

    .auth-shell,
    .app-shell {
      width: min(100%, 820px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .auth-shell {
      display: grid;
      align-items: center;
      padding: 32px 20px;
    }

    .login-panel {
      width: min(100%, 420px);
      margin: 0 auto;
    }

    .login-brand {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--accent);
    }

    .login-brand h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }

    .login-brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--line);
    }

    .brand { min-width: 0; }

    .brand-name {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-user {
      max-width: 160px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button,
    .compact-button,
    .secondary-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .icon-button { padding: 8px 12px; }
    .compact-button { padding: 7px 11px; font-size: 13px; }
    .secondary-button { width: 100%; padding: 10px 14px; }

    .icon-button:hover,
    .compact-button:hover,
    .secondary-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #back-button { display: none; }
    #back-button.visible { display: inline-flex; align-items: center; justify-content: center; }

    main { padding: 26px 22px 56px; }
    .view { display: none; }
    .view.active { display: block; }

    .section-heading {
      margin: 0 0 6px;
      font-size: 23px;
      line-height: 1.35;
    }

    .section-copy {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .home-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .action-button {
      min-height: 106px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .action-button:hover,
    .action-button:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .action-title {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: 750;
    }

    .action-copy {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .field { margin-bottom: 18px; }

    .field label,
    .step-title {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .text-input,
    .change-note-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }

    .text-input:focus,
    .change-note-input:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 0 10px;
    }

    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .date-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .date-option {
      display: flex;
      align-items: center;
      min-height: 44px;
      gap: 9px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }

    .date-option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 700;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .list {
      display: grid;
      gap: 9px;
      min-height: 76px;
    }

    .claim-date-group + .claim-date-group { margin-top: 26px; }

    .claim-date-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--ink);
    }

    .claim-date-heading h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .claim-date-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .list-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .list-item.single-column { grid-template-columns: minmax(0, 1fr); }
    .list-item.is-disabled { opacity: 0.62; background: var(--soft); }

    .item-date { color: var(--muted); font-size: 13px; }

    .item-course {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .category-tag,
    .status-tag {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
    }

    .category-tag { background: var(--accent-soft); color: var(--accent); }
    .status-tag { background: var(--soft); color: var(--muted); }
    .status-tag.success { background: var(--success-soft); color: var(--success); }
    .status-tag.warning { background: var(--warm-soft); color: var(--warm); }

    .change-note {
      grid-column: 2;
      margin-top: 3px;
      padding: 11px;
      border-left: 3px solid var(--warm);
      background: var(--warm-soft);
    }

    .change-note label {
      display: block;
      margin-bottom: 7px;
      color: var(--warm);
      font-size: 13px;
      font-weight: 700;
    }

    .hint { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .confirmation {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px solid var(--ink);
    }

    .confirmation-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .confirmation-heading h3 { margin: 0; font-size: 17px; }
    .confirmation-count { color: var(--accent); font-size: 14px; font-weight: 750; }

    .confirmation-list {
      max-height: 320px;
      overflow: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .confirmation-row {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }

    .confirmation-row:last-child { border-bottom: 0; }
    .confirmation-row span:first-child { color: var(--muted); }

    .primary-button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      font-weight: 750;
      cursor: pointer;
    }

    .primary-button:hover { background: var(--accent-hover); }
    .primary-button:disabled { background: #aeb8ba; cursor: not-allowed; }

    .state {
      padding: 22px 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
    }

    .state.error {
      border-style: solid;
      border-color: #efc3bf;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .notice {
      position: fixed;
      z-index: 30;
      top: 14px;
      left: 50%;
      display: none;
      width: min(calc(100% - 28px), 620px);
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(20, 37, 39, 0.15);
      font-size: 14px;
      line-height: 1.5;
      transform: translateX(-50%);
    }

    .notice.visible { display: block; }
    .notice.success { border-color: #b8dac4; background: var(--success-soft); color: var(--success); }
    .notice.error { border-color: #efc3bf; background: var(--danger-soft); color: var(--danger); }

    @media (max-width: 680px) {
      .auth-shell, .app-shell { border: 0; }
      .topbar { padding: 9px 14px; }
      .current-user { max-width: 92px; }
      main { padding: 22px 15px 44px; }
      .home-actions { grid-template-columns: 1fr; }
      .action-button { min-height: 90px; }
      .date-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .confirmation-row { grid-template-columns: 108px minmax(0, 1fr); }
    }

    @media (max-width: 380px) {
      .brand-subtitle { display: none; }
      .topbar-actions { gap: 5px; }
      .icon-button { padding: 8px 9px; }
      .date-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <section id="auth-shell" class="auth-shell">
    <div class="login-panel">
      <div class="login-brand">
        <h1>Sherry Aerial Studio</h1>
        <p>教室管理系統</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="login-teacher">姓名</label>
          <input
            id="login-teacher"
            class="text-input"
            type="text"
            list="teacher-options"
            autocomplete="name"
            required
          >
          <datalist id="teacher-options"></datalist>
        </div>
        <div class="field">
          <label for="login-pin">身分證末碼</label>
          <input
            id="login-pin"
            class="text-input"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="10"
            required
          >
        </div>
        <button id="login-submit" class="primary-button" type="submit">登入</button>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Sherry Aerial Studio</h1>
        <div class="brand-subtitle">教室管理</div>
      </div>
      <div class="topbar-actions">
        <span id="current-user" class="current-user"></span>
        <button id="back-button" class="icon-button" type="button">返回</button>
        <button id="logout-button" class="icon-button" type="button">登出</button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view active">
        <h2 class="section-heading">教室工作台</h2>
        <p id="home-greeting" class="section-copy"></p>
        <div class="home-actions">
          <button class="action-button" type="button" data-view="view-leave">
            <span class="action-title">請假登記</span>
            <span class="action-copy">依日期選擇自己的課程。</span>
          </button>
          <button class="action-button" type="button" data-view="view-myleaves">
            <span class="action-title">我的請假紀錄</span>
            <span class="action-copy">查看代課與 OB 處理狀態。</span>
          </button>
          <button class="action-button" type="button" data-view="view-claim">
            <span class="action-title">尋找與領取代課</span>
            <span class="action-copy">查看目前開放的待領課程。</span>
          </button>
          <button class="action-button" type="button" data-view="view-mysubs">
            <span class="action-title">查看我的代課紀錄</span>
            <span class="action-copy">查看已領取課程與改課內容。</span>
          </button>
        </div>
      </section>

      <section id="view-leave" class="view">
        <h2 class="section-heading">請假登記</h2>
        <p class="section-copy">目前顯示您的可登記課程。</p>

        <div class="toolbar">
          <span class="step-title">1. 選擇日期</span>
          <div class="toolbar-actions">
            <button id="select-all-visible-dates" class="compact-button" type="button">全選目前可見日期</button>
            <button id="clear-leave-dates" class="compact-button" type="button">清除全部</button>
          </div>
        </div>
        <div id="leave-date-list" class="date-list">
          <div class="state">載入中...</div>
        </div>

        <div class="toolbar">
          <span class="step-title">2. 選擇課程</span>
        </div>
        <div id="leave-course-list" class="list">
          <div class="state">請先選擇日期</div>
        </div>

        <section id="leave-confirmation" class="confirmation" hidden>
          <div class="confirmation-heading">
            <h3>送出確認</h3>
            <span id="leave-confirmation-count" class="confirmation-count">已選 0 堂</span>
          </div>
          <div id="leave-confirmation-list" class="confirmation-list"></div>
          <button id="leave-submit" class="primary-button" type="button">確認送出</button>
        </section>
      </section>

      <section id="view-myleaves" class="view">
        <h2 class="section-heading">我的請假紀錄</h2>
        <p class="section-copy">請假、代課與 OB 核對進度。</p>
        <div id="my-leaves-list" class="list">
          <div class="state">載入中...</div>
        </div>
      </section>

      <section id="view-claim" class="view">
        <h2 class="section-heading">領取代課</h2>
        <p class="section-copy">目前可領取的課程。</p>
        <div id="pending-leaves-list" class="list">
          <div class="state">載入中...</div>
        </div>
        <button id="claim-submit" class="primary-button" type="button">確認領取勾選課程</button>
      </section>

      <section id="view-mysubs" class="view">
        <h2 class="section-heading">我的代課紀錄</h2>
        <p class="section-copy">已領取課程與改課內容。</p>
        <div id="my-subs-list" class="list">
          <div class="state">載入中...</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyJADHe_DZdNIbfv_KPewAcBekEond-5Fw63i-RWCd1mHl_O9uGAQ-LTnzENZshjnhe/exec";
    const LEAVE_BATCH_SIZE = 25;
    const LAST_TEACHER_KEY = "sherry-substitute-last-teacher";

    const authState = { sessionToken: "", teacherName: "", role: "" };
    let globalCourseList = [];
    let pendingLeaves = [];
    let selectedLeaveDates = new Set();
    let selectedLeaveCourses = new Set();

    const byId = (id) => document.getElementById(id);

    async function readApiResponse(response) {
      if (!response.ok) throw new Error(`系統連線失敗（HTTP ${response.status}）`);
      const payload = await response.json();
      if (!payload || payload.status !== "success") {
        if (payload && payload.message) throw new Error(payload.message);
        throw new Error("系統回覆格式錯誤。");
      }
      return payload.data;
    }

    async function callApi(action, params = {}) {
      const query = new URLSearchParams({ action });
      const requestParams = { ...params };
      if (authState.sessionToken && !requestParams.sessionToken) {
        requestParams.sessionToken = authState.sessionToken;
      }
      Object.entries(requestParams).forEach(([key, value]) => {
        query.set(key, typeof value === "string" ? value : JSON.stringify(value));
      });

      const response = await fetch(`${APP_URL}?${query.toString()}`, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });
      return readApiResponse(response);
    }

    async function callPostApi(action, params = {}) {
      const body = new URLSearchParams({ action });
      const requestParams = { ...params };
      if (authState.sessionToken && !requestParams.sessionToken) {
        requestParams.sessionToken = authState.sessionToken;
      }
      Object.entries(requestParams).forEach(([key, value]) => {
        body.set(key, typeof value === "string" ? value : JSON.stringify(value));
      });

      const response = await fetch(APP_URL, {
        method: "POST",
        redirect: "follow",
        cache: "no-store",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: body.toString()
      });
      return readApiResponse(response);
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeCourseName(value) {
      return String(value || "").replace(/\s+/g, "").toLowerCase();
    }

    function getCourseCategory(courseName) {
      const name = normalizeCourseName(courseName);
      if (/空中?瑜伽|空瑜/.test(name)) return "空瑜";
      if (/空環/.test(name)) return "空環";
      if (/舞綢/.test(name)) return "舞綢";
      if (/柔軟度|柔軟開發/.test(name)) return "柔軟度";
      if (/綢吊/.test(name)) return "綢吊";
      if (/瑜伽/.test(name)) return "瑜伽";
      return "其他";
    }

    function requiresChangeNote(targetCourseName) {
      const teacherCourses = globalCourseList.map((item) => normalizeCourseName(item["課程"]));
      const targetName = normalizeCourseName(targetCourseName);
      const targetCategory = getCourseCategory(targetName);
      if (targetCategory === "其他") return !teacherCourses.includes(targetName);
      return !teacherCourses.some((name) => getCourseCategory(name) === targetCategory);
    }

    function setNotice(message, type = "success") {
      const notice = byId("notice");
      notice.textContent = message;
      notice.className = `notice visible ${type}`;
      window.setTimeout(() => {
        if (notice.textContent === message) clearNotice();
      }, 7000);
    }

    function clearNotice() {
      const notice = byId("notice");
      notice.textContent = "";
      notice.className = "notice";
    }

    function setButtonBusy(button, busy, busyText) {
      if (!button.dataset.defaultText) button.dataset.defaultText = button.textContent;
      button.disabled = busy;
      button.textContent = busy ? busyText : button.dataset.defaultText;
    }

    function rememberTeacher(name) {
      try { window.localStorage.setItem(LAST_TEACHER_KEY, name); } catch (error) { /* Storage may be disabled. */ }
    }

    function readRememberedTeacher() {
      try { return window.localStorage.getItem(LAST_TEACHER_KEY) || ""; } catch (error) { return ""; }
    }

    function showLoggedInApp() {
      byId("auth-shell").hidden = true;
      byId("app-shell").hidden = false;
      byId("current-user").textContent = authState.teacherName;
      byId("home-greeting").textContent = `${authState.teacherName}，您好。`;
      switchView("view-home");
    }

    function clearSession() {
      authState.sessionToken = "";
      authState.teacherName = "";
      authState.role = "";
      globalCourseList = [];
      pendingLeaves = [];
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      byId("app-shell").hidden = true;
      byId("auth-shell").hidden = false;
      byId("login-pin").value = "";
      byId("login-pin").focus();
    }

    async function initialize() {
      try {
        const teachers = await callApi("getTeachers");
        const names = [...new Set(teachers.map((item) => item["指導者"]).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"));
        byId("teacher-options").innerHTML = names
          .map((name) => `<option value="${escapeHtml(name)}"></option>`)
          .join("");
        byId("login-teacher").value = readRememberedTeacher();
      } catch (error) {
        setNotice(error.message, "error");
      }
    }

    async function login(event) {
      event.preventDefault();
      const teacherName = byId("login-teacher").value.trim();
      const pin = byId("login-pin").value.trim();
      if (!teacherName || !pin) return setNotice("請輸入姓名與身分證末碼。", "error");

      const button = byId("login-submit");
      clearNotice();
      setButtonBusy(button, true, "登入中...");
      try {
        const session = await callPostApi("login", { teacherName, pin });
        authState.sessionToken = session.sessionToken;
        authState.teacherName = session.teacherName;
        authState.role = session.role;
        rememberTeacher(session.teacherName);
        byId("login-pin").value = "";
        showLoggedInApp();
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    async function logout() {
      const token = authState.sessionToken;
      clearSession();
      if (!token) return;
      try {
        await callPostApi("logout", { sessionToken: token });
      } catch (error) {
        // The local session is already cleared, including when the server session expired.
      }
    }

    function switchView(viewId) {
      clearNotice();
      document.querySelectorAll(".view").forEach((view) => {
        view.classList.toggle("active", view.id === viewId);
      });
      byId("back-button").classList.toggle("visible", viewId !== "view-home");

      if (viewId === "view-leave") loadMyCourses();
      if (viewId === "view-myleaves") fetchMyLeaves();
      if (viewId === "view-claim") fetchAvailableSubstitutes();
      if (viewId === "view-mysubs") fetchMySubs();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadMyCourses() {
      byId("leave-date-list").innerHTML = '<div class="state">載入中...</div>';
      byId("leave-course-list").innerHTML = '<div class="state">請先選擇日期</div>';
      byId("leave-confirmation").hidden = true;
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      try {
        globalCourseList = await callApi("getMyCourses");
        renderLeaveDates();
        renderLeaveCourses();
      } catch (error) {
        byId("leave-date-list").innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderLeaveDates() {
      const list = byId("leave-date-list");
      const dates = [...new Set(globalCourseList.map((item) => item["日期"]).filter(Boolean))].sort();
      const availableDates = new Set(dates);
      selectedLeaveDates = new Set([...selectedLeaveDates].filter((date) => availableDates.has(date)));

      if (!dates.length) {
        list.innerHTML = '<div class="state">目前沒有可登記的課程</div>';
        return;
      }

      list.innerHTML = dates.map((date) => `
        <label class="date-option">
          <input type="checkbox" class="leave-date-checkbox" data-date="${escapeHtml(date)}" ${selectedLeaveDates.has(date) ? "checked" : ""}>
          <span>${escapeHtml(date)}</span>
        </label>
      `).join("");

      document.querySelectorAll(".leave-date-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedLeaveDates.add(checkbox.dataset.date);
          else selectedLeaveDates.delete(checkbox.dataset.date);
          renderLeaveCourses();
        });
      });
    }

    function selectAllVisibleDates() {
      document.querySelectorAll(".leave-date-checkbox").forEach((checkbox) => {
        checkbox.checked = true;
        selectedLeaveDates.add(checkbox.dataset.date);
      });
      renderLeaveCourses();
    }

    function clearLeaveDates() {
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      renderLeaveDates();
      renderLeaveCourses();
    }

    function getVisibleLeaveCourses() {
      return globalCourseList
        .filter((item) => selectedLeaveDates.has(item["日期"]))
        .sort((a, b) => `${a["日期"]} ${a["時間"]} ${a["課程"]}`
          .localeCompare(`${b["日期"]} ${b["時間"]} ${b["課程"]}`));
    }

    function renderLeaveCourses() {
      const list = byId("leave-course-list");
      const visibleCourses = getVisibleLeaveCourses();
      const visibleIds = new Set(visibleCourses.map((item) => item["OB Calendar ID"]));
      selectedLeaveCourses = new Set([...selectedLeaveCourses].filter((id) => visibleIds.has(id)));

      if (!selectedLeaveDates.size) {
        list.innerHTML = '<div class="state">請先選擇日期</div>';
        updateLeaveConfirmation();
        return;
      }
      if (!visibleCourses.length) {
        list.innerHTML = '<div class="state">所選日期沒有可登記課程</div>';
        updateLeaveConfirmation();
        return;
      }

      list.innerHTML = visibleCourses.map((item) => {
        const calendarId = item["OB Calendar ID"];
        return `
          <label class="list-item">
            <input type="checkbox" class="leave-course-checkbox" data-calendar-id="${escapeHtml(calendarId)}" ${selectedLeaveCourses.has(calendarId) ? "checked" : ""}>
            <span>
              <span class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時間"])}</span>
              <span class="item-course">${escapeHtml(item["課程"])}</span>
              <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
            </span>
          </label>
        `;
      }).join("");

      document.querySelectorAll(".leave-course-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedLeaveCourses.add(checkbox.dataset.calendarId);
          else selectedLeaveCourses.delete(checkbox.dataset.calendarId);
          updateLeaveConfirmation();
        });
      });
      updateLeaveConfirmation();
    }

    function getSelectedLeaveItems() {
      return globalCourseList
        .filter((item) => selectedLeaveCourses.has(item["OB Calendar ID"]))
        .sort((a, b) => `${a["日期"]} ${a["時間"]}`.localeCompare(`${b["日期"]} ${b["時間"]}`));
    }

    function updateLeaveConfirmation() {
      const selectedLeaveItems = getSelectedLeaveItems();
      const selectedLeaveCourses = selectedLeaveItems;
      const section = byId("leave-confirmation");
      section.hidden = selectedLeaveCourses.length === 0;
      byId("leave-confirmation-count").textContent = `已選 ${selectedLeaveCourses.length} 堂`;
      byId("leave-confirmation-list").innerHTML = selectedLeaveCourses.map((item) => `
        <div class="confirmation-row">
          <span>${escapeHtml(item["日期"])} ${escapeHtml(item["時間"])}</span>
          <strong>${escapeHtml(item["課程"])}</strong>
        </div>
      `).join("");
      byId("leave-submit").textContent = `確認送出 ${selectedLeaveCourses.length} 堂`;
    }

    function validateLeaveBatchResult(result, batchLength) {
      const fields = ["requested", "created", "duplicates", "failed"];
      if (!result || fields.some((field) => !Number.isInteger(result[field]) || result[field] < 0)) {
        throw new Error("系統未回傳完整的送出筆數。");
      }
      if (result.requested !== batchLength ||
          result.created + result.duplicates + result.failed !== result.requested) {
        throw new Error("送出結果與勾選堂數不一致，請查看我的請假紀錄後再試。");
      }
    }

    async function submitLeave() {
      const items = getSelectedLeaveItems();
      if (!items.length) return setNotice("請至少勾選一堂請假課程。", "error");
      if (!window.confirm(`確認送出 ${items.length} 堂請假申請？`)) return;

      const button = byId("leave-submit");
      const totals = { requested: 0, created: 0, duplicates: 0, failed: 0 };
      clearNotice();
      setButtonBusy(button, true, "正在送出...");
      try {
        for (let start = 0; start < items.length; start += LEAVE_BATCH_SIZE) {
          const batch = items.slice(start, start + LEAVE_BATCH_SIZE);
          const result = await callPostApi("submitLeave", { items: batch });
          validateLeaveBatchResult(result, batch.length);
          totals.requested += result.requested;
          totals.created += result.created;
          totals.duplicates += result.duplicates;
          totals.failed += result.failed;
        }

        if (totals.requested !== items.length ||
            totals.created + totals.duplicates + totals.failed !== items.length) {
          throw new Error("送出結果與勾選堂數不一致，請查看我的請假紀錄後再試。");
        }
        if (totals.failed) {
          throw new Error(`有 ${totals.failed} 堂送出失敗；已成功 ${totals.created} 堂，重複 ${totals.duplicates} 堂。`);
        }

        switchView("view-myleaves");
        const duplicateText = totals.duplicates ? `，另有 ${totals.duplicates} 堂原已登記` : "";
        setNotice(`請假登記完成：新增 ${totals.created} 堂${duplicateText}。`);
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    function statusClass(value) {
      if (/完成|已核對|已領取/.test(value || "")) return "success";
      if (/申請|確認|待/.test(value || "")) return "warning";
      return "";
    }

    async function fetchMyLeaves() {
      const list = byId("my-leaves-list");
      list.innerHTML = '<div class="state">查詢中...</div>';
      try {
        const items = await callApi("getMyLeaves");
        if (!items.length) {
          list.innerHTML = '<div class="state">目前沒有請假紀錄</div>';
          return;
        }
        list.innerHTML = items.map((item) => {
          const actualCourse = item["實際課程名稱"] || "沿用原課程／尚未填寫";
          const level = item["預計難度"] || "未填寫";
          const verification = item["OB 核對狀態"] || "尚未核對";
          const changeState = item["異動狀態"] || "無";
          return `
            <article class="list-item single-column">
              <div>
                <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
                <div class="item-course">${escapeHtml(item["課程"])}</div>
                <span class="status-tag ${statusClass(item["狀態"])}">${escapeHtml(item["狀態"] || "未設定")}</span>
                <div class="item-meta">代課老師：${escapeHtml(item["代課老師"] || "尚未領取")}</div>
                <div class="item-meta">實際課程名稱：${escapeHtml(actualCourse)}</div>
                <div class="item-meta">預計難度：${escapeHtml(level)}</div>
                <div class="item-meta">處理類型：${escapeHtml(item["處理類型"] || "尚未填寫")}</div>
                <div class="item-meta">OB 核對狀態：${escapeHtml(verification)}</div>
                ${item["OB 核對時間"] ? `<div class="item-meta">核對時間：${escapeHtml(item["OB 核對時間"])}</div>` : ""}
                ${item["差異原因"] ? `<div class="item-meta">核對差異：${escapeHtml(item["差異原因"])}</div>` : ""}
                <div class="item-meta">異動狀態：${escapeHtml(changeState)}</div>
                ${item["備註"] ? `<div class="item-meta">備註：${escapeHtml(item["備註"])}</div>` : ""}
              </div>
            </article>
          `;
        }).join("");
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    async function fetchAvailableSubstitutes() {
      const list = byId("pending-leaves-list");
      list.innerHTML = '<div class="state">載入中...</div>';
      try {
        const [availableSubstitutes, teacherCourses] = await Promise.all([
          callApi("getAvailableSubstitutes"),
          globalCourseList.length ? Promise.resolve(globalCourseList) : callApi("getMyCourses")
        ]);
        pendingLeaves = availableSubstitutes;
        globalCourseList = teacherCourses;
        pendingLeaves.sort((a, b) => `${a["日期"]} ${a["時段"]} ${a["原老師"]}`
          .localeCompare(`${b["日期"]} ${b["時段"]} ${b["原老師"]}`));
        renderAvailableSubstitutes();
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function groupAvailableSubstitutesByDate(items) {
      return items.reduce((groups, item) => {
        const date = item["日期"] || "日期未設定";
        if (!groups.has(date)) groups.set(date, []);
        groups.get(date).push(item);
        return groups;
      }, new Map());
    }

    function renderAvailableSubstitutes() {
      const list = byId("pending-leaves-list");
      const button = byId("claim-submit");
      const available = pendingLeaves;
      if (!available.length) {
        list.innerHTML = '<div class="state">目前沒有可領取的代課</div>';
        button.disabled = true;
        return;
      }
      button.disabled = false;

      const groups = groupAvailableSubstitutesByDate(available);
      list.innerHTML = [...groups.entries()].map(([date, items]) => `
        <section class="claim-date-group" data-claim-date="${escapeHtml(date)}">
          <div class="claim-date-heading">
            <h3>${escapeHtml(date)}</h3>
            <span class="claim-date-count">${items.length} 堂待領</span>
          </div>
          <div class="list">
            ${items.map(renderAvailableSubstituteItem).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderAvailableSubstituteItem(item) {
      const substituteId = item["代課編號"];
      const noteRequired = requiresChangeNote(item["課程"]);
      return `
        <div class="list-item">
          <input type="checkbox" class="claim-checkbox" data-substitute-id="${escapeHtml(substituteId)}">
          <div>
            <div class="item-date">${escapeHtml(item["時段"])}</div>
            <div class="item-course">${escapeHtml(item["課程"])}</div>
            <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
            <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
          </div>
          <div class="change-note">
            <label for="note-${escapeHtml(substituteId)}">${noteRequired ? "改成什麼課（必填）" : "難度或其他備註（選填）"}</label>
            <input
              id="note-${escapeHtml(substituteId)}"
              class="change-note-input"
              type="text"
              maxlength="120"
              data-note-for="${escapeHtml(substituteId)}"
              data-required="${noteRequired ? "true" : "false"}"
              placeholder="例如：改空環 Lv.1／難度調整"
            >
            ${noteRequired ? '<div class="hint">這堂課不屬於您目前的授課大類。</div>' : ""}
          </div>
        </div>
      `;
    }

    async function submitClaim() {
      const checked = [...document.querySelectorAll(".claim-checkbox:checked")];
      if (!checked.length) return setNotice("請至少勾選一堂代課課程。", "error");

      const items = [];
      for (const checkbox of checked) {
        const substituteId = checkbox.dataset.substituteId;
        const noteInput = document.querySelector(`[data-note-for="${CSS.escape(substituteId)}"]`);
        const changeNote = noteInput ? noteInput.value.trim() : "";
        if (noteInput && noteInput.dataset.required === "true" && !changeNote) {
          noteInput.focus();
          return setNotice("跨課程種類代課時，請填寫要改成什麼課。", "error");
        }
        items.push({ substituteId, changeNote });
      }

      const button = byId("claim-submit");
      clearNotice();
      setButtonBusy(button, true, "正在領取...");
      try {
        const result = await callPostApi("claimSubstitute", { items });
        if (!result || result.count !== items.length) {
          throw new Error("領取結果與勾選堂數不一致，請重新整理確認。");
        }
        const claimedIds = new Set(items.map((item) => item.substituteId));
        pendingLeaves = pendingLeaves.filter((item) => !claimedIds.has(item["代課編號"]));
        renderAvailableSubstitutes();
        setNotice("代課領取成功。");
        await fetchAvailableSubstitutes();
      } catch (error) {
        setNotice(error.message, "error");
        if (/剛被其他老師領取|重新整理/.test(error.message)) await fetchAvailableSubstitutes();
      } finally {
        setButtonBusy(button, false, "");
        button.disabled = pendingLeaves.length === 0;
      }
    }

    async function fetchMySubs() {
      const list = byId("my-subs-list");
      list.innerHTML = '<div class="state">查詢中...</div>';
      try {
        const items = await callApi("getMySubs");
        if (!items.length) {
          list.innerHTML = '<div class="state">目前沒有代課紀錄</div>';
          return;
        }
        list.innerHTML = items.map((item) => `
          <article class="list-item single-column">
            <div>
              <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
              <div class="item-course">${escapeHtml(item["課程"])}</div>
              <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
              ${item["備註"] ? `<div class="item-meta">備註：${escapeHtml(item["備註"])}</div>` : ""}
            </div>
          </article>
        `).join("");
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    byId("login-form").addEventListener("submit", login);
    byId("logout-button").addEventListener("click", logout);
    byId("back-button").addEventListener("click", () => switchView("view-home"));
    byId("select-all-visible-dates").addEventListener("click", selectAllVisibleDates);
    byId("clear-leave-dates").addEventListener("click", clearLeaveDates);
    byId("leave-submit").addEventListener("click", submitLeave);
    byId("claim-submit").addEventListener("click", submitClaim);
    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    initialize();
  </script>
</body>
</html>
