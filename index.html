<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry Aerial | 教室管理</title>
  <style>
    :root {
      --ink: #1f292b;
      --muted: #647174;
      --line: #d9e0e1;
      --surface: #ffffff;
      --page: #edf2f2;
      --soft: #f5f8f8;
      --accent: #24656a;
      --accent-hover: #194e52;
      --accent-soft: #e4f1f1;
      --warm: #9a5a13;
      --warm-soft: #fff4e5;
      --danger: #a33a32;
      --danger-soft: #fceceb;
      --success: #2d6845;
      --success-soft: #e9f5ed;
      --radius: 8px;
    }

    * { box-sizing: border-box; }
    [hidden] { display: none !important; }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--page);
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", sans-serif;
      letter-spacing: 0;
    }

    button, input, select, textarea { font: inherit; }
    button { touch-action: manipulation; }

    .auth-shell,
    .app-shell {
      width: min(100%, 820px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .auth-shell {
      display: grid;
      align-items: center;
      padding: 32px 20px;
    }

    .login-panel {
      width: min(100%, 420px);
      margin: 0 auto;
    }

    .login-brand {
      margin-bottom: 28px;
      padding-bottom: 20px;
      border-bottom: 3px solid var(--accent);
    }

    .login-brand h1 {
      margin: 0;
      font-size: 28px;
      line-height: 1.25;
    }

    .login-brand p {
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 15px;
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 68px;
      padding: 10px 20px;
      background: rgba(255, 255, 255, 0.97);
      border-bottom: 1px solid var(--line);
    }

    .brand { min-width: 0; }

    .brand-name {
      margin: 0;
      font-size: 18px;
      font-weight: 750;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .topbar-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .current-user {
      max-width: 160px;
      overflow: hidden;
      color: var(--muted);
      font-size: 13px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .icon-button,
    .compact-button,
    .secondary-button {
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .icon-button { padding: 8px 12px; }
    .compact-button { padding: 7px 11px; font-size: 13px; }
    .secondary-button { width: 100%; padding: 10px 14px; }

    .icon-button:hover,
    .compact-button:hover,
    .secondary-button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    #back-button { display: none; }
    #back-button.visible { display: inline-flex; align-items: center; justify-content: center; }

    main { padding: 26px 22px 56px; }
    .view { display: none; }
    .view.active { display: block; }

    .section-heading {
      margin: 0 0 6px;
      font-size: 23px;
      line-height: 1.35;
    }

    .section-copy {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.55;
    }

    .home-actions {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .action-button {
      min-height: 106px;
      padding: 17px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .action-button:hover,
    .action-button:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .action-title {
      display: block;
      margin-bottom: 7px;
      font-size: 17px;
      font-weight: 750;
    }

    .action-copy {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.45;
    }

    .field { margin-bottom: 18px; }

    .field label,
    .step-title {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 700;
    }

    .text-input,
    .change-note-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }

    .text-input:focus,
    .change-note-input:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
    }

    .toolbar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin: 24px 0 10px;
    }

    .toolbar-actions { display: flex; flex-wrap: wrap; gap: 8px; }

    .date-list {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
    }

    .date-option {
      display: flex;
      align-items: center;
      min-height: 44px;
      gap: 9px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
    }

    .date-option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
      font-weight: 700;
    }

    input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 0;
      accent-color: var(--accent);
      flex: 0 0 auto;
    }

    .list {
      display: grid;
      gap: 9px;
      min-height: 76px;
    }

    .claim-date-group + .claim-date-group { margin-top: 26px; }

    .claim-date-heading {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin: 0 0 10px;
      padding-bottom: 8px;
      border-bottom: 2px solid var(--ink);
    }

    .claim-date-heading h3 {
      margin: 0;
      font-size: 17px;
      line-height: 1.4;
    }

    .claim-date-count {
      color: var(--muted);
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
    }

    .list-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 12px;
      padding: 15px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .list-item.single-column { grid-template-columns: minmax(0, 1fr); }
    .list-item.is-disabled { opacity: 0.62; background: var(--soft); }

    .item-date { color: var(--muted); font-size: 13px; }

    .item-course {
      margin-top: 3px;
      font-size: 16px;
      font-weight: 750;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    .category-tag,
    .status-tag {
      display: inline-block;
      margin-top: 7px;
      padding: 3px 7px;
      border-radius: 4px;
      font-size: 12px;
      font-weight: 700;
    }

    .category-tag { background: var(--accent-soft); color: var(--accent); }
    .status-tag { background: var(--soft); color: var(--muted); }
    .status-tag.success { background: var(--success-soft); color: var(--success); }
    .status-tag.warning { background: var(--warm-soft); color: var(--warm); }

    .claim-card {
      grid-template-columns: 24px minmax(0, 1fr);
      padding: 0;
      overflow: hidden;
    }

    .claim-card > .claim-checkbox { margin: 18px 0 0 16px; }

    .claim-summary {
      min-width: 0;
      padding: 15px 16px 14px 0;
    }

    .claim-requirement {
      display: inline-flex;
      align-items: center;
      min-height: 26px;
      margin-top: 9px;
      padding: 3px 8px;
      border-radius: 4px;
      background: var(--warm-soft);
      color: var(--warm);
      font-size: 12px;
      font-weight: 700;
    }

    .claim-editor {
      grid-column: 1 / -1;
      padding: 16px;
      border-top: 1px solid var(--line);
      background: var(--soft);
    }

    .claim-editor[hidden] { display: none; }

    .claim-editor-title {
      margin: 0 0 12px;
      font-size: 14px;
      font-weight: 750;
    }

    .handling-options {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin-bottom: 14px;
    }

    .handling-option {
      display: grid;
      place-items: center;
      min-height: 46px;
      padding: 7px 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      cursor: pointer;
      text-align: center;
      font-size: 13px;
      font-weight: 700;
      line-height: 1.35;
    }

    .handling-option:has(input:checked) {
      border-color: var(--accent);
      background: var(--accent-soft);
      color: var(--accent-hover);
    }

    .handling-option:has(input:disabled) { opacity: 0.45; cursor: not-allowed; }
    .handling-option input { position: absolute; opacity: 0; pointer-events: none; }

    .claim-fields {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .claim-field { min-width: 0; }
    .claim-field.full { grid-column: 1 / -1; }

    .claim-field label {
      display: block;
      margin-bottom: 6px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 700;
    }

    .claim-control {
      width: 100%;
      min-height: 44px;
      padding: 9px 10px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }

    textarea.claim-control {
      min-height: 82px;
      resize: vertical;
      line-height: 1.5;
    }

    .claim-control:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
    }

    .claim-required { color: var(--danger); }

    .hint { margin-top: 6px; color: var(--muted); font-size: 12px; line-height: 1.45; }

    .confirmation {
      margin-top: 24px;
      padding-top: 20px;
      border-top: 2px solid var(--ink);
    }

    .confirmation-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 10px;
    }

    .confirmation-heading h3 { margin: 0; font-size: 17px; }
    .confirmation-count { color: var(--accent); font-size: 14px; font-weight: 750; }

    .confirmation-list {
      max-height: 320px;
      overflow: auto;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
    }

    .confirmation-row {
      display: grid;
      grid-template-columns: 130px minmax(0, 1fr);
      gap: 12px;
      padding: 10px 2px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      line-height: 1.45;
    }

    .confirmation-row:last-child { border-bottom: 0; }
    .confirmation-row span:first-child { color: var(--muted); }

    .primary-button {
      width: 100%;
      min-height: 50px;
      margin-top: 18px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      font-weight: 750;
      cursor: pointer;
    }

    .primary-button:hover { background: var(--accent-hover); }
    .primary-button:disabled { background: #aeb8ba; cursor: not-allowed; }

    .record-actions, .admin-header-actions, .admin-item-actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-top: 12px;
    }

    .danger-button {
      min-height: 40px;
      padding: 8px 12px;
      border: 1px solid #dfaaa5;
      border-radius: var(--radius);
      background: var(--danger-soft);
      color: var(--danger);
      font-weight: 700;
      cursor: pointer;
    }

    .admin-summary {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 8px;
      margin: 18px 0;
    }

    .summary-item, .admin-control {
      padding: 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--soft);
    }

    .summary-item strong { display: block; margin-top: 3px; font-size: 20px; }
    .summary-item span { color: var(--muted); font-size: 12px; }
    .admin-control { margin-bottom: 14px; }

    .admin-tabs {
      display: flex;
      gap: 6px;
      overflow-x: auto;
      padding-bottom: 8px;
      border-bottom: 1px solid var(--line);
    }

    .admin-tab {
      flex: 0 0 auto;
      min-height: 40px;
      padding: 8px 11px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--muted);
      cursor: pointer;
      font-size: 13px;
      font-weight: 700;
    }

    .admin-tab.active { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
    .admin-tab-content { margin-top: 16px; }

    .teacher-picker {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 7px;
      margin: 10px 0;
    }

    .teacher-option {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 42px;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      font-size: 13px;
    }

    .admin-select { width: 100%; min-height: 42px; margin-top: 8px; }

    dialog {
      width: min(calc(100% - 28px), 480px);
      padding: 0;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: 0 20px 60px rgba(20, 37, 39, 0.22);
    }

    dialog::backdrop { background: rgba(19, 33, 35, 0.48); }
    .dialog-body { padding: 20px; }
    .dialog-body h3 { margin: 0 0 7px; }
    .dialog-actions { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

    .state {
      padding: 22px 14px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.55;
    }

    .state.error {
      border-style: solid;
      border-color: #efc3bf;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .notice {
      position: fixed;
      z-index: 30;
      top: 14px;
      left: 50%;
      display: none;
      width: min(calc(100% - 28px), 620px);
      padding: 12px 14px;
      border: 1px solid transparent;
      border-radius: var(--radius);
      box-shadow: 0 8px 24px rgba(20, 37, 39, 0.15);
      font-size: 14px;
      line-height: 1.5;
      transform: translateX(-50%);
    }

    .notice.visible { display: block; }
    .notice.success { border-color: #b8dac4; background: var(--success-soft); color: var(--success); }
    .notice.error { border-color: #efc3bf; background: var(--danger-soft); color: var(--danger); }

    @media (max-width: 680px) {
      .auth-shell, .app-shell { border: 0; }
      .topbar { padding: 9px 14px; }
      .current-user { max-width: 92px; }
      main { padding: 22px 15px 44px; }
      .home-actions { grid-template-columns: 1fr; }
      .action-button { min-height: 90px; }
      .date-list { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .handling-options { grid-template-columns: 1fr; }
      .claim-fields { grid-template-columns: 1fr; }
      .claim-field.full { grid-column: auto; }
      .confirmation-row { grid-template-columns: 108px minmax(0, 1fr); }
      .admin-summary, .teacher-picker { grid-template-columns: 1fr 1fr; }
    }

    @media (max-width: 380px) {
      .brand-subtitle { display: none; }
      .topbar-actions { gap: 5px; }
      .icon-button { padding: 8px 9px; }
      .date-list { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <div id="notice" class="notice" role="status" aria-live="polite"></div>

  <section id="auth-shell" class="auth-shell">
    <div class="login-panel">
      <div class="login-brand">
        <h1>Sherry Aerial Studio</h1>
        <p>教室管理系統</p>
      </div>
      <form id="login-form">
        <div class="field">
          <label for="login-teacher">姓名</label>
          <input
            id="login-teacher"
            class="text-input"
            type="text"
            list="teacher-options"
            autocomplete="name"
            required
          >
          <datalist id="teacher-options"></datalist>
        </div>
        <div class="field">
          <label for="login-pin">身分證末碼</label>
          <input
            id="login-pin"
            class="text-input"
            type="password"
            inputmode="numeric"
            autocomplete="current-password"
            maxlength="10"
            required
          >
        </div>
        <button id="login-submit" class="primary-button" type="submit">登入</button>
      </form>
    </div>
  </section>

  <div id="app-shell" class="app-shell" hidden>
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Sherry Aerial Studio</h1>
        <div class="brand-subtitle">教室管理</div>
      </div>
      <div class="topbar-actions">
        <span id="current-user" class="current-user"></span>
        <button id="back-button" class="icon-button" type="button">返回</button>
        <button id="logout-button" class="icon-button" type="button">登出</button>
      </div>
    </header>

    <main>
      <section id="view-home" class="view active">
        <h2 class="section-heading">教室工作台</h2>
        <p id="home-greeting" class="section-copy"></p>
        <div class="home-actions">
          <button class="action-button" type="button" data-view="view-leave">
            <span class="action-title">請假登記</span>
            <span class="action-copy">依日期選擇自己的課程。</span>
          </button>
          <button class="action-button" type="button" data-view="view-myleaves">
            <span class="action-title">我的請假紀錄</span>
            <span class="action-copy">查看代課與 OB 處理狀態。</span>
          </button>
          <button class="action-button" type="button" data-view="view-claim">
            <span class="action-title">尋找與領取代課</span>
            <span class="action-copy">查看目前開放的待領課程。</span>
          </button>
          <button class="action-button" type="button" data-view="view-mysubs">
            <span class="action-title">查看我的代課紀錄</span>
            <span class="action-copy">查看已領取課程與改課內容。</span>
          </button>
          <button id="admin-entry" class="action-button" type="button" data-view="view-admin" hidden>
            <span class="action-title">管理工作台</span>
            <span class="action-copy">邀請、異動、OB 處理與核對。</span>
          </button>
        </div>
      </section>

      <section id="view-leave" class="view">
        <h2 class="section-heading">請假登記</h2>
        <p class="section-copy">目前顯示您的可登記課程。</p>

        <div class="toolbar">
          <span class="step-title">1. 選擇日期</span>
          <div class="toolbar-actions">
            <button id="select-all-visible-dates" class="compact-button" type="button">全選目前可見日期</button>
            <button id="clear-leave-dates" class="compact-button" type="button">清除全部</button>
          </div>
        </div>
        <div id="leave-date-list" class="date-list">
          <div class="state">載入中...</div>
        </div>

        <div class="toolbar">
          <span class="step-title">2. 選擇課程</span>
        </div>
        <div id="leave-course-list" class="list">
          <div class="state">請先選擇日期</div>
        </div>

        <section id="leave-confirmation" class="confirmation" hidden>
          <div class="confirmation-heading">
            <h3>送出確認</h3>
            <span id="leave-confirmation-count" class="confirmation-count">已選 0 堂</span>
          </div>
          <div id="leave-confirmation-list" class="confirmation-list"></div>
          <button id="leave-submit" class="primary-button" type="button">確認送出</button>
        </section>
      </section>

      <section id="view-myleaves" class="view">
        <h2 class="section-heading">我的請假紀錄</h2>
        <p class="section-copy">請假、代課與 OB 核對進度。</p>
        <div id="my-leaves-list" class="list">
          <div class="state">載入中...</div>
        </div>
      </section>

      <section id="view-claim" class="view">
        <h2 class="section-heading">領取代課</h2>
        <p class="section-copy">依日期查看目前可領取的課程。</p>
        <datalist id="existing-class-options"></datalist>
        <div id="pending-leaves-list" class="list">
          <div class="state">載入中...</div>
        </div>
        <button id="claim-submit" class="primary-button" type="button">確認領取勾選課程</button>
      </section>

      <section id="view-mysubs" class="view">
        <h2 class="section-heading">我的代課紀錄</h2>
        <p class="section-copy">已領取課程與改課內容。</p>
        <div id="my-subs-list" class="list">
          <div class="state">載入中...</div>
        </div>
      </section>

      <section id="view-admin" class="view">
        <h2 class="section-heading">代課管理工作台</h2>
        <p class="section-copy">所有操作都會留下紀錄；OB 課表只在您手動同步時更新。</p>
        <div class="admin-header-actions">
          <button id="admin-sync" class="compact-button" type="button">同步 OB 課表</button>
          <button id="admin-reconcile" class="compact-button" type="button">重新核對 OB</button>
        </div>
        <div id="admin-summary" class="admin-summary"></div>
        <div class="admin-tabs" role="tablist" aria-label="管理工作區">
          <button class="admin-tab active" type="button" data-admin-tab="pendingInvitations">待邀請</button>
          <button class="admin-tab" type="button" data-admin-tab="activeInvitees">邀請中</button>
          <button class="admin-tab" type="button" data-admin-tab="obWork">待處理 OB</button>
          <button class="admin-tab" type="button" data-admin-tab="changeRequests">取消／退出</button>
          <button class="admin-tab" type="button" data-admin-tab="exceptions">核對異常</button>
          <button class="admin-tab" type="button" data-admin-tab="completed">已完成</button>
        </div>
        <div id="admin-tab-content" class="admin-tab-content">
          <div class="state">載入中...</div>
        </div>
      </section>
    </main>
  </div>

  <dialog id="request-dialog">
    <form id="request-form" class="dialog-body" method="dialog">
      <h3 id="request-dialog-title">填寫原因</h3>
      <p id="request-dialog-copy" class="section-copy"></p>
      <textarea id="request-reason" class="claim-control" maxlength="240" placeholder="請填寫原因"></textarea>
      <div class="dialog-actions">
        <button id="request-cancel" class="compact-button" type="button">返回</button>
        <button id="request-confirm" class="primary-button" type="submit">確認送出</button>
      </div>
    </form>
  </dialog>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyJADHe_DZdNIbfv_KPewAcBekEond-5Fw63i-RWCd1mHl_O9uGAQ-LTnzENZshjnhe/exec";
    const LEAVE_BATCH_SIZE = 25;
    const LAST_TEACHER_KEY = "sherry-substitute-last-teacher";

    const authState = { sessionToken: "", teacherName: "", role: "" };
    let globalCourseList = [];
    let pendingLeaves = [];
    let claimOptions = { capabilities: [], classes: [] };
    let selectedLeaveDates = new Set();
    let selectedLeaveCourses = new Set();
    let adminDashboard = null;
    let activeAdminTab = "pendingInvitations";
    let requestDialogState = null;

    const byId = (id) => document.getElementById(id);

    async function readApiResponse(response) {
      if (!response.ok) throw new Error(`系統連線失敗（HTTP ${response.status}）`);
      const payload = await response.json();
      if (!payload || payload.status !== "success") {
        if (payload && payload.message) throw new Error(payload.message);
        throw new Error("系統回覆格式錯誤。");
      }
      return payload.data;
    }

    async function callApi(action, params = {}) {
      const query = new URLSearchParams({ action });
      const requestParams = { ...params };
      if (authState.sessionToken && !requestParams.sessionToken) {
        requestParams.sessionToken = authState.sessionToken;
      }
      Object.entries(requestParams).forEach(([key, value]) => {
        query.set(key, typeof value === "string" ? value : JSON.stringify(value));
      });

      const response = await fetch(`${APP_URL}?${query.toString()}`, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });
      return readApiResponse(response);
    }

    async function callPostApi(action, params = {}) {
      const body = new URLSearchParams({ action });
      const requestParams = { ...params };
      if (authState.sessionToken && !requestParams.sessionToken) {
        requestParams.sessionToken = authState.sessionToken;
      }
      Object.entries(requestParams).forEach(([key, value]) => {
        body.set(key, typeof value === "string" ? value : JSON.stringify(value));
      });

      const response = await fetch(APP_URL, {
        method: "POST",
        redirect: "follow",
        cache: "no-store",
        headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" },
        body: body.toString()
      });
      return readApiResponse(response);
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeCourseName(value) {
      return String(value || "").replace(/\s+/g, "").toLowerCase();
    }

    function getCourseCategory(courseName) {
      const name = normalizeCourseName(courseName);
      if (/空中?瑜伽|空瑜/.test(name)) return "空瑜";
      if (/空環/.test(name)) return "空環";
      if (/舞綢/.test(name)) return "舞綢";
      if (/柔軟度|柔軟開發/.test(name)) return "柔軟度";
      if (/綢吊/.test(name)) return "綢吊";
      if (/瑜伽/.test(name)) return "瑜伽";
      return "其他";
    }

    function claimNoteIsRequired(item, handlingType, actualCategory) {
      const target = item || {};
      const targetCategory = target["課程大類"] || getCourseCategory(target["課程"]);
      if (target["可沿用原課程"] !== true) return true;
      return handlingType !== "original" && !!actualCategory && actualCategory !== targetCategory;
    }

    function validateClaimDraft(draft, item) {
      const change = draft || {};
      const target = item || {};
      const handlingType = String(change.handlingType || "original");
      const actualClassId = String(change.actualClassId || "").trim();
      const actualCourseName = String(change.actualCourseName || "").trim();
      const category = String(change.category || "").trim();
      const difficulty = String(change.difficulty || "").trim();
      const note = String(change.note || "").trim();
      const canReuseOriginal = target["可沿用原課程"] === true;
      const targetCategory = target["課程大類"] || getCourseCategory(target["課程"]);

      if (handlingType === "original" && !canReuseOriginal) {
        throw new Error("這堂課不在您的可教授類別中，不能沿用原課程。");
      }
      if (handlingType === "existing" && !actualClassId) {
        throw new Error("請選擇要改用的 OB 現有課程。");
      }
      if (handlingType === "new") {
        if (!actualCourseName) throw new Error("請填寫需要新增的課程名稱。");
        if (!category) throw new Error("請選擇需要新增課程的類別。");
        if (!difficulty) throw new Error("需要新增課程時，請填寫難度。");
      }
      if (!["original", "existing", "new"].includes(handlingType)) {
        throw new Error("課程處理方式無效，請重新選擇。");
      }

      const actualCategory = handlingType === "original" ? targetCategory : category;
      if (claimNoteIsRequired(target, handlingType, actualCategory) && !note) {
        throw new Error("跨道具代課時，請填寫改課原因或補充備註。");
      }

      return {
        substituteId: String(target["代課編號"] || ""),
        handlingType,
        actualClassId,
        actualCourseName,
        category,
        difficulty,
        note
      };
    }

    function setNotice(message, type = "success") {
      const notice = byId("notice");
      notice.textContent = message;
      notice.className = `notice visible ${type}`;
      window.setTimeout(() => {
        if (notice.textContent === message) clearNotice();
      }, 7000);
    }

    function clearNotice() {
      const notice = byId("notice");
      notice.textContent = "";
      notice.className = "notice";
    }

    function setButtonBusy(button, busy, busyText) {
      if (!button.dataset.defaultText) button.dataset.defaultText = button.textContent;
      button.disabled = busy;
      button.textContent = busy ? busyText : button.dataset.defaultText;
    }

    function rememberTeacher(name) {
      try { window.localStorage.setItem(LAST_TEACHER_KEY, name); } catch (error) { /* Storage may be disabled. */ }
    }

    function readRememberedTeacher() {
      try { return window.localStorage.getItem(LAST_TEACHER_KEY) || ""; } catch (error) { return ""; }
    }

    function showLoggedInApp() {
      byId("auth-shell").hidden = true;
      byId("app-shell").hidden = false;
      byId("current-user").textContent = authState.teacherName;
      byId("home-greeting").textContent = `${authState.teacherName}，您好。`;
      byId("admin-entry").hidden = authState.role !== "管理員";
      switchView("view-home");
    }

    function clearSession() {
      authState.sessionToken = "";
      authState.teacherName = "";
      authState.role = "";
      globalCourseList = [];
      pendingLeaves = [];
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      adminDashboard = null;
      byId("admin-entry").hidden = true;
      byId("app-shell").hidden = true;
      byId("auth-shell").hidden = false;
      byId("login-pin").value = "";
      byId("login-pin").focus();
    }

    async function initialize() {
      try {
        const teachers = await callApi("getTeachers");
        const names = [...new Set(teachers.map((item) => item["指導者"]).filter(Boolean))]
          .sort((a, b) => a.localeCompare(b, "zh-Hant"));
        byId("teacher-options").innerHTML = names
          .map((name) => `<option value="${escapeHtml(name)}"></option>`)
          .join("");
        byId("login-teacher").value = readRememberedTeacher();
      } catch (error) {
        setNotice(error.message, "error");
      }
    }

    async function login(event) {
      event.preventDefault();
      const teacherName = byId("login-teacher").value.trim();
      const pin = byId("login-pin").value.trim();
      if (!teacherName || !pin) return setNotice("請輸入姓名與身分證末碼。", "error");

      const button = byId("login-submit");
      clearNotice();
      setButtonBusy(button, true, "登入中...");
      try {
        const session = await callPostApi("login", { teacherName, pin });
        authState.sessionToken = session.sessionToken;
        authState.teacherName = session.teacherName;
        authState.role = session.role;
        rememberTeacher(session.teacherName);
        byId("login-pin").value = "";
        showLoggedInApp();
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    async function logout() {
      const token = authState.sessionToken;
      clearSession();
      if (!token) return;
      try {
        await callPostApi("logout", { sessionToken: token });
      } catch (error) {
        // The local session is already cleared, including when the server session expired.
      }
    }

    function switchView(viewId) {
      if (viewId === "view-admin" && authState.role !== "管理員") {
        return setNotice("需要管理權限。", "error");
      }
      clearNotice();
      document.querySelectorAll(".view").forEach((view) => {
        view.classList.toggle("active", view.id === viewId);
      });
      byId("back-button").classList.toggle("visible", viewId !== "view-home");

      if (viewId === "view-leave") loadMyCourses();
      if (viewId === "view-myleaves") fetchMyLeaves();
      if (viewId === "view-claim") fetchAvailableSubstitutes();
      if (viewId === "view-mysubs") fetchMySubs();
      if (viewId === "view-admin") fetchAdminDashboard();
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    async function loadMyCourses() {
      byId("leave-date-list").innerHTML = '<div class="state">載入中...</div>';
      byId("leave-course-list").innerHTML = '<div class="state">請先選擇日期</div>';
      byId("leave-confirmation").hidden = true;
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      try {
        globalCourseList = await callApi("getMyCourses");
        renderLeaveDates();
        renderLeaveCourses();
      } catch (error) {
        byId("leave-date-list").innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderLeaveDates() {
      const list = byId("leave-date-list");
      const dates = [...new Set(globalCourseList.map((item) => item["日期"]).filter(Boolean))].sort();
      const availableDates = new Set(dates);
      selectedLeaveDates = new Set([...selectedLeaveDates].filter((date) => availableDates.has(date)));

      if (!dates.length) {
        list.innerHTML = '<div class="state">目前沒有可登記的課程</div>';
        return;
      }

      list.innerHTML = dates.map((date) => `
        <label class="date-option">
          <input type="checkbox" class="leave-date-checkbox" data-date="${escapeHtml(date)}" ${selectedLeaveDates.has(date) ? "checked" : ""}>
          <span>${escapeHtml(date)}</span>
        </label>
      `).join("");

      document.querySelectorAll(".leave-date-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedLeaveDates.add(checkbox.dataset.date);
          else selectedLeaveDates.delete(checkbox.dataset.date);
          renderLeaveCourses();
        });
      });
    }

    function selectAllVisibleDates() {
      document.querySelectorAll(".leave-date-checkbox").forEach((checkbox) => {
        checkbox.checked = true;
        selectedLeaveDates.add(checkbox.dataset.date);
      });
      renderLeaveCourses();
    }

    function clearLeaveDates() {
      selectedLeaveDates = new Set();
      selectedLeaveCourses = new Set();
      renderLeaveDates();
      renderLeaveCourses();
    }

    function getVisibleLeaveCourses() {
      return globalCourseList
        .filter((item) => selectedLeaveDates.has(item["日期"]))
        .sort((a, b) => `${a["日期"]} ${a["時間"]} ${a["課程"]}`
          .localeCompare(`${b["日期"]} ${b["時間"]} ${b["課程"]}`));
    }

    function renderLeaveCourses() {
      const list = byId("leave-course-list");
      const visibleCourses = getVisibleLeaveCourses();
      const visibleIds = new Set(visibleCourses.map((item) => item["OB Calendar ID"]));
      selectedLeaveCourses = new Set([...selectedLeaveCourses].filter((id) => visibleIds.has(id)));

      if (!selectedLeaveDates.size) {
        list.innerHTML = '<div class="state">請先選擇日期</div>';
        updateLeaveConfirmation();
        return;
      }
      if (!visibleCourses.length) {
        list.innerHTML = '<div class="state">所選日期沒有可登記課程</div>';
        updateLeaveConfirmation();
        return;
      }

      list.innerHTML = visibleCourses.map((item) => {
        const calendarId = item["OB Calendar ID"];
        return `
          <label class="list-item">
            <input type="checkbox" class="leave-course-checkbox" data-calendar-id="${escapeHtml(calendarId)}" ${selectedLeaveCourses.has(calendarId) ? "checked" : ""}>
            <span>
              <span class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時間"])}</span>
              <span class="item-course">${escapeHtml(item["課程"])}</span>
              <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
            </span>
          </label>
        `;
      }).join("");

      document.querySelectorAll(".leave-course-checkbox").forEach((checkbox) => {
        checkbox.addEventListener("change", () => {
          if (checkbox.checked) selectedLeaveCourses.add(checkbox.dataset.calendarId);
          else selectedLeaveCourses.delete(checkbox.dataset.calendarId);
          updateLeaveConfirmation();
        });
      });
      updateLeaveConfirmation();
    }

    function getSelectedLeaveItems() {
      return globalCourseList
        .filter((item) => selectedLeaveCourses.has(item["OB Calendar ID"]))
        .sort((a, b) => `${a["日期"]} ${a["時間"]}`.localeCompare(`${b["日期"]} ${b["時間"]}`));
    }

    function updateLeaveConfirmation() {
      const selectedLeaveItems = getSelectedLeaveItems();
      const selectedLeaveCourses = selectedLeaveItems;
      const section = byId("leave-confirmation");
      section.hidden = selectedLeaveCourses.length === 0;
      byId("leave-confirmation-count").textContent = `已選 ${selectedLeaveCourses.length} 堂`;
      byId("leave-confirmation-list").innerHTML = selectedLeaveCourses.map((item) => `
        <div class="confirmation-row">
          <span>${escapeHtml(item["日期"])} ${escapeHtml(item["時間"])}</span>
          <strong>${escapeHtml(item["課程"])}</strong>
        </div>
      `).join("");
      byId("leave-submit").textContent = `確認送出 ${selectedLeaveCourses.length} 堂`;
    }

    function validateLeaveBatchResult(result, batchLength) {
      const fields = ["requested", "created", "duplicates", "failed"];
      if (!result || fields.some((field) => !Number.isInteger(result[field]) || result[field] < 0)) {
        throw new Error("系統未回傳完整的送出筆數。");
      }
      if (result.requested !== batchLength ||
          result.created + result.duplicates + result.failed !== result.requested) {
        throw new Error("送出結果與勾選堂數不一致，請查看我的請假紀錄後再試。");
      }
    }

    async function submitLeave() {
      const items = getSelectedLeaveItems();
      if (!items.length) return setNotice("請至少勾選一堂請假課程。", "error");
      if (!window.confirm(`確認送出 ${items.length} 堂請假申請？`)) return;

      const button = byId("leave-submit");
      const totals = { requested: 0, created: 0, duplicates: 0, failed: 0 };
      clearNotice();
      setButtonBusy(button, true, "正在送出...");
      try {
        for (let start = 0; start < items.length; start += LEAVE_BATCH_SIZE) {
          const batch = items.slice(start, start + LEAVE_BATCH_SIZE);
          const result = await callPostApi("submitLeave", { items: batch });
          validateLeaveBatchResult(result, batch.length);
          totals.requested += result.requested;
          totals.created += result.created;
          totals.duplicates += result.duplicates;
          totals.failed += result.failed;
        }

        if (totals.requested !== items.length ||
            totals.created + totals.duplicates + totals.failed !== items.length) {
          throw new Error("送出結果與勾選堂數不一致，請查看我的請假紀錄後再試。");
        }
        if (totals.failed) {
          throw new Error(`有 ${totals.failed} 堂送出失敗；已成功 ${totals.created} 堂，重複 ${totals.duplicates} 堂。`);
        }

        switchView("view-myleaves");
        const duplicateText = totals.duplicates ? `，另有 ${totals.duplicates} 堂原已登記` : "";
        setNotice(`請假登記完成：新增 ${totals.created} 堂${duplicateText}。`);
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    function statusClass(value) {
      if (/完成|已核對|已領取/.test(value || "")) return "success";
      if (/申請|確認|待/.test(value || "")) return "warning";
      return "";
    }

    async function fetchMyLeaves() {
      const list = byId("my-leaves-list");
      list.innerHTML = '<div class="state">查詢中...</div>';
      try {
        const items = await callApi("getMyLeaves");
        if (!items.length) {
          list.innerHTML = '<div class="state">目前沒有請假紀錄</div>';
          return;
        }
        list.innerHTML = items.map((item) => {
          const actualCourse = item["實際課程名稱"] || "沿用原課程／尚未填寫";
          const level = item["預計難度"] || "未填寫";
          const verification = item["OB 核對狀態"] || "尚未核對";
          const changeState = item["異動狀態"] || "無";
          return `
            <article class="list-item single-column">
              <div>
                <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
                <div class="item-course">${escapeHtml(item["課程"])}</div>
                <span class="status-tag ${statusClass(item["狀態"])}">${escapeHtml(item["狀態"] || "未設定")}</span>
                <div class="item-meta">代課老師：${escapeHtml(item["代課老師"] || "尚未領取")}</div>
                <div class="item-meta">實際課程名稱：${escapeHtml(actualCourse)}</div>
                <div class="item-meta">預計難度：${escapeHtml(level)}</div>
                <div class="item-meta">處理類型：${escapeHtml(item["處理類型"] || "尚未填寫")}</div>
                <div class="item-meta">OB 核對狀態：${escapeHtml(verification)}</div>
                ${item["OB 核對時間"] ? `<div class="item-meta">核對時間：${escapeHtml(item["OB 核對時間"])}</div>` : ""}
                ${item["差異原因"] ? `<div class="item-meta">核對差異：${escapeHtml(item["差異原因"])}</div>` : ""}
                <div class="item-meta">異動狀態：${escapeHtml(changeState)}</div>
                ${item["備註"] ? `<div class="item-meta">備註：${escapeHtml(item["備註"])}</div>` : ""}
                ${renderAuditHistory(item["異動紀錄"])}
                <div class="record-actions">
                  ${item["可自行取消"] ? `<button class="danger-button" type="button" data-leave-action="cancel" data-substitute-id="${escapeHtml(item["代課編號"])}">取消請假</button>` : ""}
                  ${item["可申請取消"] ? `<button class="danger-button" type="button" data-leave-action="request-cancel" data-substitute-id="${escapeHtml(item["代課編號"])}">申請取消</button>` : ""}
                </div>
              </div>
            </article>
          `;
        }).join("");
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    async function fetchAvailableSubstitutes() {
      const list = byId("pending-leaves-list");
      list.innerHTML = '<div class="state">載入中...</div>';
      try {
        const [availableSubstitutes, options] = await Promise.all([
          callApi("getAvailableSubstitutes"),
          callApi("getClaimOptions")
        ]);
        pendingLeaves = availableSubstitutes;
        claimOptions = options || { capabilities: [], classes: [] };
        renderClaimClassOptions();
        pendingLeaves.sort((a, b) => `${a["日期"]} ${a["時段"]} ${a["原老師"]}`
          .localeCompare(`${b["日期"]} ${b["時段"]} ${b["原老師"]}`));
        renderAvailableSubstitutes();
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function getTeachableClaimClasses() {
      const capabilities = new Set(claimOptions.capabilities || []);
      return (claimOptions.classes || []).filter((item) => capabilities.has(item.category));
    }

    function renderClaimClassOptions() {
      byId("existing-class-options").innerHTML = getTeachableClaimClasses().map((item) =>
        `<option value="${escapeHtml(item.classId)}" label="${escapeHtml(`${item.courseName}｜${item.category}｜${item.classId}`)}"></option>`
      ).join("");
    }

    function findSelectedClaimClass(value) {
      const wantedClassId = String(value || "").trim();
      return getTeachableClaimClasses().find((item) => item.classId === wantedClassId) || null;
    }

    function groupAvailableSubstitutesByDate(items) {
      return items.reduce((groups, item) => {
        const date = item["日期"] || "日期未設定";
        if (!groups.has(date)) groups.set(date, []);
        groups.get(date).push(item);
        return groups;
      }, new Map());
    }

    function renderAvailableSubstitutes() {
      const list = byId("pending-leaves-list");
      const button = byId("claim-submit");
      const available = pendingLeaves;
      if (!available.length) {
        list.innerHTML = '<div class="state">目前沒有可領取的代課</div>';
        button.disabled = true;
        return;
      }
      button.disabled = false;

      const groups = groupAvailableSubstitutesByDate(available);
      list.innerHTML = [...groups.entries()].map(([date, items]) => `
        <section class="claim-date-group" data-claim-date="${escapeHtml(date)}">
          <div class="claim-date-heading">
            <h3>${escapeHtml(date)}</h3>
            <span class="claim-date-count">${items.length} 堂待領</span>
          </div>
          <div class="list">
            ${items.map(renderAvailableSubstituteItem).join("")}
          </div>
        </section>
      `).join("");
    }

    function renderAvailableSubstituteItem(item) {
      const substituteId = item["代課編號"];
      const canReuseOriginal = item["可沿用原課程"] === true;
      const hasExistingClass = getTeachableClaimClasses().length > 0;
      const defaultHandling = canReuseOriginal ? "original" : (hasExistingClass ? "existing" : "new");
      const capabilities = claimOptions.capabilities || [];
      return `
        <article class="list-item claim-card" data-claim-card-id="${escapeHtml(substituteId)}">
          <input type="checkbox" class="claim-checkbox" data-substitute-id="${escapeHtml(substituteId)}">
          <div class="claim-summary">
            <div class="item-date">${escapeHtml(item["時段"])}</div>
            <div class="item-course">${escapeHtml(item["課程"])}</div>
            <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
            <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
            ${canReuseOriginal ? "" : '<div class="claim-requirement">需要改成可教授的課程</div>'}
          </div>
          <div class="claim-editor" hidden>
            <div class="claim-editor-title">實際授課安排</div>
            <div class="handling-options" role="group" aria-label="課程處理方式">
              <label class="handling-option">
                <input type="radio" name="handling-${escapeHtml(substituteId)}" value="original"
                  ${defaultHandling === "original" ? "checked" : ""} ${canReuseOriginal ? "" : "disabled"}>
                沿用原課程
              </label>
              <label class="handling-option">
                <input type="radio" name="handling-${escapeHtml(substituteId)}" value="existing"
                  ${defaultHandling === "existing" ? "checked" : ""} ${hasExistingClass ? "" : "disabled"}>
                改用既有 OB 課程
              </label>
              <label class="handling-option">
                <input type="radio" name="handling-${escapeHtml(substituteId)}" value="new"
                  ${defaultHandling === "new" ? "checked" : ""}>
                需要新增課程
              </label>
            </div>

            <div class="claim-fields">
              <div class="claim-field full existing-class-panel" hidden>
                <label>搜尋 OB 現有課程 <span class="claim-required">必填</span></label>
                <input class="claim-control class-search existing-class-search" type="text"
                  list="existing-class-options" autocomplete="off" placeholder="輸入課名或課程代碼搜尋">
              </div>

              <div class="claim-field new-course-panel" hidden>
                <label>新課程名稱 <span class="claim-required">必填</span></label>
                <input class="claim-control new-course-name" type="text" maxlength="80" placeholder="例如：空環入門">
              </div>

              <div class="claim-field new-course-panel" hidden>
                <label>課程類別 <span class="claim-required">必填</span></label>
                <select class="claim-control new-course-category">
                  <option value="">請選擇</option>
                  ${capabilities.map((category) => `<option value="${escapeHtml(category)}">${escapeHtml(category)}</option>`).join("")}
                </select>
              </div>

              <div class="claim-field">
                <label>難度／等級 <span class="new-difficulty-required claim-required" hidden>必填</span></label>
                <input class="claim-control claim-difficulty" type="text" maxlength="40" placeholder="例如：Lv.1、基礎">
              </div>

              <div class="claim-field full">
                <label>備註 <span class="claim-note-required claim-required" ${canReuseOriginal ? "hidden" : ""}>跨道具必填</span></label>
                <textarea class="claim-control claim-note" maxlength="240" placeholder="可填改課原因、難度調整或其他事項"></textarea>
              </div>
            </div>
          </div>
        </article>
      `;
    }

    function updateClaimCardState(card) {
      if (!card) return;
      const checked = card.querySelector(".claim-checkbox").checked;
      const editor = card.querySelector(".claim-editor");
      editor.hidden = !checked;
      if (!checked) return;
      const handling = card.querySelector('input[type="radio"]:checked')?.value || "original";
      card.querySelector(".existing-class-panel").hidden = handling !== "existing";
      card.querySelectorAll(".new-course-panel").forEach((field) => {
        field.hidden = handling !== "new";
      });
      card.querySelector(".new-difficulty-required").hidden = handling !== "new";
      const substituteId = card.dataset.claimCardId;
      const item = pendingLeaves.find((entry) => entry["代課編號"] === substituteId) || {};
      let actualCategory = item["課程大類"] || getCourseCategory(item["課程"]);
      if (handling === "existing") {
        const selectedClass = findSelectedClaimClass(card.querySelector(".existing-class-search").value);
        actualCategory = selectedClass ? selectedClass.category : "";
      } else if (handling === "new") {
        actualCategory = card.querySelector(".new-course-category").value;
      }
      card.querySelector(".claim-note-required").hidden =
        !claimNoteIsRequired(item, handling, actualCategory);
    }

    function readClaimDraft(card) {
      const handlingType = card.querySelector('input[type="radio"]:checked')?.value || "original";
      const existingClass = findSelectedClaimClass(card.querySelector(".existing-class-search").value);
      return {
        handlingType,
        actualClassId: handlingType === "existing" && existingClass ? existingClass.classId : "",
        actualCourseName: handlingType === "existing" && existingClass
          ? existingClass.courseName
          : card.querySelector(".new-course-name").value,
        category: handlingType === "existing" && existingClass
          ? existingClass.category
          : card.querySelector(".new-course-category").value,
        difficulty: card.querySelector(".claim-difficulty").value,
        note: card.querySelector(".claim-note").value
      };
    }

    async function submitClaim() {
      const checked = [...document.querySelectorAll(".claim-checkbox:checked")];
      if (!checked.length) return setNotice("請至少勾選一堂代課課程。", "error");

      const items = [];
      for (const checkbox of checked) {
        const substituteId = checkbox.dataset.substituteId;
        const card = checkbox.closest(".claim-card");
        const target = pendingLeaves.find((item) => item["代課編號"] === substituteId);
        try {
          items.push(validateClaimDraft(readClaimDraft(card), target));
        } catch (error) {
          if (card && card.scrollIntoView) card.scrollIntoView({ behavior: "smooth", block: "center" });
          return setNotice(error.message, "error");
        }
      }

      const button = byId("claim-submit");
      clearNotice();
      setButtonBusy(button, true, "正在領取...");
      try {
        const result = await callPostApi("claimSubstitute", { items });
        if (!result || result.count !== items.length) {
          throw new Error("領取結果與勾選堂數不一致，請重新整理確認。");
        }
        const claimedIds = new Set(items.map((item) => item.substituteId));
        pendingLeaves = pendingLeaves.filter((item) => !claimedIds.has(item["代課編號"]));
        renderAvailableSubstitutes();
        setNotice("代課領取成功。");
        await fetchAvailableSubstitutes();
      } catch (error) {
        setNotice(error.message, "error");
        if (/剛被其他老師領取|重新整理/.test(error.message)) await fetchAvailableSubstitutes();
      } finally {
        setButtonBusy(button, false, "");
        button.disabled = pendingLeaves.length === 0;
      }
    }

    async function fetchMySubs() {
      const list = byId("my-subs-list");
      list.innerHTML = '<div class="state">查詢中...</div>';
      try {
        const items = await callApi("getMySubs");
        if (!items.length) {
          list.innerHTML = '<div class="state">目前沒有代課紀錄</div>';
          return;
        }
        list.innerHTML = items.map((item) => `
          <article class="list-item single-column">
            <div>
              <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
              <div class="item-course">${escapeHtml(item["課程"])}</div>
              <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
              <div class="item-meta">處理方式：${escapeHtml(item["處理類型"] || "尚未填寫")}</div>
              <div class="item-meta">實際課程：${escapeHtml(item["實際課程名稱"] || item["課程"])}</div>
              ${item["預計難度"] ? `<div class="item-meta">難度：${escapeHtml(item["預計難度"])}</div>` : ""}
              ${item["備註"] ? `<div class="item-meta">備註：${escapeHtml(item["備註"])}</div>` : ""}
              <div class="item-meta">異動狀態：${escapeHtml(item["異動狀態"] || "無")}</div>
              ${renderAuditHistory(item["異動紀錄"])}
              <div class="record-actions">
                ${item["可申請退出"] ? `<button class="danger-button" type="button" data-sub-action="withdraw" data-substitute-id="${escapeHtml(item["代課編號"])}">申請退出代課</button>` : ""}
              </div>
            </div>
          </article>
        `).join("");
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderAuditHistory(history) {
      const items = Array.isArray(history) ? history : [];
      if (!items.length) return "";
      return `<details class="item-meta"><summary>查看異動紀錄（${items.length}）</summary>${items.map((entry) =>
        `<div>${escapeHtml(entry.time)}｜${escapeHtml(entry.action)}${entry.reason ? `｜${escapeHtml(entry.reason)}` : ""}</div>`
      ).join("")}</details>`;
    }

    async function cancelOwnLeave(substituteId) {
      if (!window.confirm("確定取消這堂請假嗎？")) return;
      await callPostApi("cancelLeave", { substituteId });
      setNotice("請假已取消。");
      await fetchMyLeaves();
    }

    async function requestOwnLeaveCancellation(substituteId, reason) {
      await callPostApi("requestLeaveCancellation", { substituteId, reason });
      setNotice("取消申請已送出。");
      await fetchMyLeaves();
    }

    async function requestOwnClaimWithdrawal(substituteId, reason) {
      await callPostApi("requestClaimWithdrawal", { substituteId, reason });
      setNotice("退出代課申請已送出。");
      await fetchMySubs();
    }

    function openRequestDialog(options) {
      requestDialogState = options;
      byId("request-dialog-title").textContent = options.title;
      byId("request-dialog-copy").textContent = options.copy || "";
      byId("request-reason").value = "";
      byId("request-reason").required = options.reasonRequired !== false;
      const dialog = byId("request-dialog");
      if (dialog.showModal) dialog.showModal();
      else dialog.hidden = false;
    }

    function closeRequestDialog() {
      requestDialogState = null;
      const dialog = byId("request-dialog");
      if (dialog.close) dialog.close();
      else dialog.hidden = true;
    }

    async function submitRequestDialog(event) {
      event.preventDefault();
      if (!requestDialogState) return;
      const state = requestDialogState;
      const reason = byId("request-reason").value.trim();
      if (state.reasonRequired !== false && !reason) return setNotice("請填寫原因。", "error");
      const button = byId("request-confirm");
      setButtonBusy(button, true, "處理中...");
      try {
        if (state.action === "request-cancel") {
          await requestOwnLeaveCancellation(state.substituteId, reason);
        } else if (state.action === "withdraw") {
          await requestOwnClaimWithdrawal(state.substituteId, reason);
        } else if (state.action === "resolve") {
          await resolveAdminChangeRequest(state.substituteId, state.decision, reason);
        }
        closeRequestDialog();
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    async function fetchAdminDashboard() {
      const content = byId("admin-tab-content");
      content.innerHTML = '<div class="state">載入中...</div>';
      try {
        adminDashboard = await callApi("getAdminDashboard");
        renderAdminDashboard();
      } catch (error) {
        content.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderAdminDashboard() {
      const data = adminDashboard || {};
      byId("admin-summary").innerHTML = [
        ["待領取", (data.pendingInvitations || []).length],
        ["待處理 OB", (data.obWork || []).length],
        ["待處理異動", (data.changeRequests || []).length]
      ].map(([label, count]) => `<div class="summary-item"><span>${label}</span><strong>${count}</strong></div>`).join("");
      document.querySelectorAll(".admin-tab").forEach((button) => {
        button.classList.toggle("active", button.dataset.adminTab === activeAdminTab);
      });
      renderAdminTab();
    }

    function renderAdminTab() {
      const data = adminDashboard || {};
      const content = byId("admin-tab-content");
      if (activeAdminTab === "pendingInvitations") {
        const activeNames = new Set((data.activeInvitees || []).map((item) => item.teacherName));
        const teachers = (data.teachers || []).filter((name) => !activeNames.has(name));
        content.innerHTML = `
          <div class="admin-control">
            <strong>開放代課給老師</strong>
            <div class="teacher-picker">${teachers.map((name) => `<label class="teacher-option"><input class="admin-teacher-checkbox" type="checkbox" value="${escapeHtml(name)}"><span>${escapeHtml(name)}</span></label>`).join("") || "目前沒有其他可邀請老師"}</div>
            <div class="admin-item-actions">
              <button class="compact-button" type="button" data-admin-action="open-invitations">開放給勾選老師</button>
              <button class="compact-button" type="button" data-admin-action="copy-invitation">複製 LINE 邀請文字</button>
            </div>
          </div>
          ${renderAdminItems(data.pendingInvitations, "目前沒有待領取代課")}`;
      } else if (activeAdminTab === "activeInvitees") {
        content.innerHTML = `
          <div class="admin-control"><strong>全域狀態：${data.paused ? "已暫停領取" : "開放中"}</strong><div class="admin-item-actions"><button class="compact-button" type="button" data-admin-action="toggle-pause">${data.paused ? "恢復全部領取" : "暫停全部領取"}</button></div></div>
          ${(data.activeInvitees || []).map((item) => `<article class="list-item single-column"><div><div class="item-course">${escapeHtml(item.teacherName)}</div><div class="item-meta">開放：${escapeHtml(item.openedAt)}｜首次查看：${escapeHtml(item.viewedAt || "尚未查看")}</div><div class="admin-item-actions"><button class="danger-button" type="button" data-admin-action="close-invitation" data-teacher-name="${escapeHtml(item.teacherName)}">關閉邀請</button></div></div></article>`).join("") || '<div class="state">目前沒有邀請中的老師</div>'}`;
      } else if (activeAdminTab === "obWork" || activeAdminTab === "exceptions") {
        const items = data[activeAdminTab] || [];
        content.innerHTML = items.map((item) => renderAdminObItem(item, data.replacementOptions || [])).join("") || `<div class="state">目前沒有${activeAdminTab === "obWork" ? "待處理 OB" : "核對異常"}</div>`;
      } else if (activeAdminTab === "changeRequests") {
        content.innerHTML = (data.changeRequests || []).map((item) => `${renderAdminItem(item)}<div class="admin-item-actions"><button class="compact-button" type="button" data-admin-action="resolve" data-decision="approve" data-substitute-id="${escapeHtml(item.substituteId)}">核准</button><button class="danger-button" type="button" data-admin-action="resolve" data-decision="reject" data-substitute-id="${escapeHtml(item.substituteId)}">駁回</button></div>`).join("") || '<div class="state">目前沒有取消或退出申請</div>';
      } else {
        content.innerHTML = renderAdminItems(data.completed, "目前沒有已完成紀錄");
      }
    }

    function renderAdminItems(items, emptyText) {
      return (items || []).map(renderAdminItem).join("") || `<div class="state">${escapeHtml(emptyText)}</div>`;
    }

    function renderAdminItem(item) {
      return `<article class="list-item single-column"><div><div class="item-date">${escapeHtml(item.date)} ${escapeHtml(item.time)}</div><div class="item-course">${escapeHtml(item.originalCourse)}</div><div class="item-meta">原老師：${escapeHtml(item.originalTeacher)}｜代課老師：${escapeHtml(item.substituteTeacher || "尚未領取")}</div><div class="item-meta">狀態：${escapeHtml(item.status)}｜異動：${escapeHtml(item.changeStatus || "無")}</div>${item.note ? `<div class="item-meta">備註：${escapeHtml(item.note)}</div>` : ""}${renderAuditHistory(item.auditHistory)}</div></article>`;
    }

    function renderAdminObItem(item, options) {
      return `${renderAdminItem(item)}<div class="admin-control"><div class="item-meta">預計課程：${escapeHtml(item.actualCourse)}${item.difficulty ? `｜${escapeHtml(item.difficulty)}` : ""}</div>${item.differenceReason ? `<div class="item-meta">差異：${escapeHtml(item.differenceReason)}</div>` : ""}<select class="admin-select" data-replacement-select="${escapeHtml(item.substituteId)}"><option value="">選擇替代 OB 課程</option>${options.map((option) => `<option value="${escapeHtml(option.calendarId)}">${escapeHtml(`${option.date} ${option.time}｜${option.courseName}｜${option.teacherName}`)}</option>`).join("")}</select><div class="admin-item-actions"><button class="compact-button" type="button" data-admin-action="link-replacement" data-substitute-id="${escapeHtml(item.substituteId)}">連結替代課程</button></div></div>`;
    }

    async function openAdminInvitations() {
      const teacherNames = [...document.querySelectorAll(".admin-teacher-checkbox:checked")].map((input) => input.value);
      if (!teacherNames.length) throw new Error("請至少勾選一位老師。");
      await callPostApi("openInvitations", { teacherNames });
      setNotice(`已開放給 ${teacherNames.length} 位老師。`);
      await fetchAdminDashboard();
    }

    async function closeAdminInvitation(teacherName) {
      await callPostApi("closeInvitations", { teacherNames: [teacherName] });
      setNotice("邀請已關閉。");
      await fetchAdminDashboard();
    }

    async function toggleAdminPause() {
      await callPostApi("pauseClaims", { paused: !(adminDashboard && adminDashboard.paused) });
      await fetchAdminDashboard();
    }

    async function syncObCalendar() {
      const result = await callPostApi("syncObCalendar");
      setNotice(`OB 課表同步完成：${result.count} 筆。`);
      await fetchAdminDashboard();
    }

    async function reconcileAdminObChanges() {
      const result = await callPostApi("reconcileObChanges");
      setNotice(`核對完成：一致 ${result.matched} 筆，異常 ${result.exceptions} 筆。`);
      await fetchAdminDashboard();
    }

    async function linkAdminReplacement(substituteId, replacementCalendarId) {
      await callPostApi("linkReplacementCalendarItem", { substituteId, replacementCalendarId });
      setNotice("替代 OB 課程已連結，請重新核對。");
      await fetchAdminDashboard();
    }

    async function resolveAdminChangeRequest(substituteId, decision, reason) {
      await callPostApi("resolveChangeRequest", { substituteId, decision, reason });
      setNotice(decision === "approve" ? "申請已核准。" : "申請已駁回。");
      await fetchAdminDashboard();
    }

    async function copyInvitationMessage() {
      const text = "您好，目前有新的代課可以領取，請登入 Sherry Aerial Studio 教室管理系統查看，謝謝。";
      await navigator.clipboard.writeText(text);
      setNotice("LINE 邀請文字已複製。");
    }

    byId("login-form").addEventListener("submit", login);
    byId("logout-button").addEventListener("click", logout);
    byId("back-button").addEventListener("click", () => switchView("view-home"));
    byId("select-all-visible-dates").addEventListener("click", selectAllVisibleDates);
    byId("clear-leave-dates").addEventListener("click", clearLeaveDates);
    byId("leave-submit").addEventListener("click", submitLeave);
    byId("claim-submit").addEventListener("click", submitClaim);
    byId("request-form").addEventListener("submit", submitRequestDialog);
    byId("request-cancel").addEventListener("click", closeRequestDialog);
    byId("my-leaves-list").addEventListener("click", async (event) => {
      const button = event.target.closest ? event.target.closest("[data-leave-action]") : null;
      if (!button) return;
      try {
        if (button.dataset.leaveAction === "cancel") {
          await cancelOwnLeave(button.dataset.substituteId);
        } else {
          openRequestDialog({
            action: "request-cancel",
            substituteId: button.dataset.substituteId,
            title: "申請取消請假",
            copy: "這堂課已有人領取或進入 OB 處理，請填寫原因交由管理員確認。"
          });
        }
      } catch (error) { setNotice(error.message, "error"); }
    });
    byId("my-subs-list").addEventListener("click", (event) => {
      const button = event.target.closest ? event.target.closest("[data-sub-action='withdraw']") : null;
      if (!button) return;
      openRequestDialog({
        action: "withdraw",
        substituteId: button.dataset.substituteId,
        title: "申請退出代課",
        copy: "管理員核准後，這堂課才會重新放回待領清單。"
      });
    });
    document.querySelectorAll(".admin-tab").forEach((button) => {
      button.addEventListener("click", () => {
        activeAdminTab = button.dataset.adminTab;
        renderAdminDashboard();
      });
    });
    byId("admin-tab-content").addEventListener("click", async (event) => {
      const button = event.target.closest ? event.target.closest("[data-admin-action]") : null;
      if (!button) return;
      try {
        const action = button.dataset.adminAction;
        if (action === "open-invitations") await openAdminInvitations();
        if (action === "copy-invitation") await copyInvitationMessage();
        if (action === "close-invitation") await closeAdminInvitation(button.dataset.teacherName);
        if (action === "toggle-pause") await toggleAdminPause();
        if (action === "link-replacement") {
          const select = document.querySelector(`[data-replacement-select="${CSS.escape(button.dataset.substituteId)}"]`);
          if (!select || !select.value) throw new Error("請先選擇替代 OB 課程。");
          await linkAdminReplacement(button.dataset.substituteId, select.value);
        }
        if (action === "resolve") {
          openRequestDialog({
            action: "resolve",
            substituteId: button.dataset.substituteId,
            decision: button.dataset.decision,
            title: button.dataset.decision === "approve" ? "核准申請" : "駁回申請",
            copy: button.dataset.decision === "approve" ? "備註可以留空。" : "請填寫駁回原因。",
            reasonRequired: button.dataset.decision !== "approve"
          });
        }
      } catch (error) { setNotice(error.message, "error"); }
    });
    byId("admin-sync").addEventListener("click", async () => {
      try { await syncObCalendar(); } catch (error) { setNotice(error.message, "error"); }
    });
    byId("admin-reconcile").addEventListener("click", async () => {
      try { await reconcileAdminObChanges(); } catch (error) { setNotice(error.message, "error"); }
    });
    function handleClaimEditorChange(event) {
      const card = event.target.closest ? event.target.closest(".claim-card") : null;
      if (card) updateClaimCardState(card);
    }
    byId("pending-leaves-list").addEventListener("change", handleClaimEditorChange);
    byId("pending-leaves-list").addEventListener("input", handleClaimEditorChange);
    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });

    initialize();
  </script>
</body>
</html>
