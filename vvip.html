<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>VVIP 優先選課意願登記 | Sherry Aerial Studio</title>
  <style>
    :root { --ink:#1f3134; --muted:#607174; --sea:#287274; --sea-dark:#19585b; --aqua:#e8f5f4; --line:#cbdedd; --soft:#f6fbfb; --coral:#a94640; --coral-soft:#fff0ee; --success:#277452; --radius:8px; --shadow:0 10px 28px rgba(24,73,75,.10); }
    * { box-sizing:border-box; }
    body { margin:0; min-width:320px; background:#f1f8f7; color:var(--ink); font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC",sans-serif; line-height:1.5; }
    button,input { font:inherit; }
    button { cursor:pointer; }
    button:disabled { cursor:not-allowed; opacity:.6; }
    .page { width:min(100%,960px); margin:0 auto; padding:38px 20px 56px; }
    .brand { display:flex; align-items:center; gap:12px; margin-bottom:28px; }
    .brand-mark { display:grid; width:42px; height:42px; place-items:center; border:1px solid #a8cdcb; border-radius:8px; background:#dff0ef; color:var(--sea-dark); font-size:22px; }
    .brand h1 { margin:0; font-size:16px; }
    .brand p { margin:1px 0 0; color:var(--muted); font-size:12px; }
    .headline { padding:0 0 22px; border-bottom:1px solid var(--line); }
    .eyebrow { display:block; color:var(--sea); font-size:12px; font-weight:700; }
    h2 { margin:5px 0 7px; font-size:27px; line-height:1.25; }
    .lead { max-width:650px; margin:0; color:var(--muted); }
    .panel { margin-top:18px; padding:18px; border:1px solid var(--line); border-radius:var(--radius); background:#fff; box-shadow:var(--shadow); }
    .panel h3 { margin:0 0 8px; font-size:16px; }
    .notice { display:none; margin:18px 0 0; padding:11px 13px; border:1px solid var(--line); border-radius:var(--radius); background:var(--soft); color:var(--muted); }
    .notice.visible { display:block; }
    .notice.error { border-color:#e0aaa5; background:var(--coral-soft); color:var(--coral); }
    .notice.success { border-color:#b9dcc9; background:#eff9f3; color:var(--success); }
    .member-form { display:grid; grid-template-columns:minmax(0,1fr) auto; gap:10px; align-items:end; }
    label { display:block; color:var(--muted); font-size:12px; font-weight:700; }
    input[type="text"],input[type="search"] { width:100%; min-height:44px; margin-top:5px; padding:9px 11px; border:1px solid #b8cece; border-radius:6px; background:#fff; color:var(--ink); outline:none; }
    input:focus { border-color:var(--sea); box-shadow:0 0 0 3px rgba(40,114,116,.13); }
    .button { display:inline-flex; min-height:44px; align-items:center; justify-content:center; gap:7px; padding:9px 15px; border:1px solid var(--sea); border-radius:6px; background:var(--sea); color:#fff; font-weight:700; }
    .button:hover:not(:disabled) { background:var(--sea-dark); }
    .button.secondary { border-color:#b6cecd; background:#fff; color:var(--sea-dark); }
    .button.danger { border-color:#dfaaa5; background:var(--coral-soft); color:var(--coral); }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:12px; margin-top:20px; }
    .toolbar input { width:min(100%,360px); margin:0; }
    .counter { padding:7px 10px; border:1px solid #abd0ce; border-radius:6px; background:var(--aqua); color:var(--sea-dark); font-size:13px; font-weight:800; }
    .counter.full { border-color:#dfaaa5; background:var(--coral-soft); color:var(--coral); }
    .course-area { margin-top:14px; }
    .date-group { margin-top:14px; border-top:1px solid var(--line); }
    .date-heading { margin:0; padding:14px 0 8px; color:var(--sea-dark); font-size:15px; }
    .course-item { display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:11px; align-items:center; min-height:67px; padding:10px 0; border-top:1px solid #edf3f3; }
    .course-item:first-of-type { border-top:0; }
    .course-item input { width:18px; height:18px; accent-color:var(--sea); }
    .course-time { color:var(--sea-dark); font-size:13px; font-weight:800; }
    .course-name { display:block; margin-top:1px; font-size:15px; font-weight:750; overflow-wrap:anywhere; }
    .course-teacher { display:block; color:var(--muted); font-size:12px; }
    .course-badge { max-width:118px; color:var(--muted); font-size:11px; text-align:right; overflow-wrap:anywhere; }
    .course-badge.selected { color:var(--success); font-weight:700; }
    .summary { margin-top:20px; }
    .summary-list { margin:9px 0 0; padding:0; list-style:none; }
    .summary-list li { padding:8px 0; border-top:1px solid var(--line); font-size:13px; }
    .summary-actions { display:flex; flex-wrap:wrap; gap:9px; margin-top:14px; }
    .state { margin-top:16px; padding:24px 14px; border:1px dashed #b5cfce; border-radius:var(--radius); background:rgba(255,255,255,.66); color:var(--muted); text-align:center; }
    .state.error { border-style:solid; border-color:#dfaaa5; background:var(--coral-soft); color:var(--coral); }
    .helper { margin:8px 0 0; color:var(--muted); font-size:12px; }
    [hidden] { display:none !important; }
    @media (max-width:620px) { .page { padding:22px 14px 38px; } h2 { font-size:23px; } .member-form { grid-template-columns:1fr; } .member-form .button { width:100%; } .toolbar { align-items:stretch; } .toolbar input { width:100%; } .course-item { grid-template-columns:auto minmax(0,1fr); } .course-badge { grid-column:2; max-width:none; text-align:left; } }
  </style>
</head>
<body>
  <main class="page">
    <header class="brand"><span class="brand-mark" aria-hidden="true">S</span><div><h1>Sherry Aerial Studio</h1><p>VVIP 選課服務</p></div></header>
    <section class="headline"><span class="eyebrow">VVIP Priority Selection</span><h2>VVIP 優先選課意願登記</h2><p class="lead">請選擇您的 OB 名稱查看本期課程並累積登記，最多四堂。此為選課意願登記，不代表正式保留名額。</p></section>

    <section class="panel">
      <form id="vvip-member-form" class="member-form">
        <label for="vvip-member">OB 名稱<input id="vvip-member" type="text" list="vvip-member-options" autocomplete="off" placeholder="搜尋或選擇您的 OB 名稱" required><datalist id="vvip-member-options"></datalist></label>
        <button id="vvip-lookup" class="button" type="submit">查看課程</button>
      </form>
      <p class="helper">選錯課程請直接聯絡教室，由管理員協助取消。</p>
    </section>

    <div id="vvip-notice" class="notice" role="status" aria-live="polite"></div>
    <section id="vvip-workspace" hidden>
      <div class="toolbar"><input id="vvip-course-search" type="search" placeholder="搜尋課程或老師" aria-label="搜尋課程或老師"><span id="vvip-counter" class="counter">已選 0／4 堂</span></div>
      <div id="vvip-course-area" class="course-area"></div>
      <section id="vvip-summary" class="panel summary" hidden><h3>送出確認</h3><p id="vvip-summary-copy" class="helper"></p><ul id="vvip-summary-list" class="summary-list"></ul><div class="summary-actions"><button id="vvip-submit" class="button" type="button">送出選課意願</button><button id="vvip-retry" class="button secondary" type="button" hidden>重新整理</button></div></section>
    </section>
  </main>
  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyJADHe_DZdNIbfv_KPewAcBekEond-5Fw63i-RWCd1mHl_O9uGAQ-LTnzENZshjnhe/exec";
    const LIMIT = 4;
    const state = { members: [], memberId: "", data: null, selectedCalendarIds: new Set(), existingCalendarIds: new Set() };
    const byId = (id) => document.getElementById(id);

    function escapeHtml(value) { return String(value == null ? "" : value).replaceAll("&", "&amp;").replaceAll("<", "&lt;").replaceAll(">", "&gt;").replaceAll('"', "&quot;").replaceAll("'", "&#39;"); }
    function showNotice(message, type = "") { const el = byId("vvip-notice"); el.textContent = message; el.className = `notice visible ${type}`; }
    function clearNotice() { const el = byId("vvip-notice"); el.textContent = ""; el.className = "notice"; }
    function setBusy(button, busy, text) { if (!button.dataset.label) button.dataset.label = button.textContent; button.disabled = busy; button.textContent = busy ? text : button.dataset.label; }

    async function callVvipApi(action, params = {}) {
      const body = new URLSearchParams({ action });
      Object.entries(params).forEach(([key, value]) => body.set(key, typeof value === "string" ? value : JSON.stringify(value)));
      const response = await fetch(APP_URL, { method: "POST", redirect: "follow", cache: "no-store", headers: { "Content-Type": "application/x-www-form-urlencoded;charset=UTF-8" }, body: body.toString() });
      if (!response.ok) throw new Error(`系統連線失敗（HTTP ${response.status}）`);
      const payload = await response.json();
      if (!payload || payload.status !== "success") throw new Error(payload && payload.message ? payload.message : "系統回覆格式錯誤。");
      return payload.data;
    }

    function getAllSelectedIds() { return new Set([...state.existingCalendarIds, ...state.selectedCalendarIds]); }
    function getSelectedCount() { return getAllSelectedIds().size; }
    function groupCoursesByDate(courses) { return (courses || []).reduce((groups, course) => { (groups[course.date] ||= []).push(course); return groups; }, {}); }
    function filterVvipCourses(courses, query) { const term = String(query || "").trim().toLowerCase(); return !term ? courses : courses.filter((course) => `${course.courseName} ${course.teacherName} ${course.date} ${course.time}`.toLowerCase().includes(term)); }
    function selectedCourses() { const selected = new Set(state.selectedCalendarIds); return (state.data ? state.data.courses : []).filter((course) => selected.has(course.calendarId)); }

    function renderCounter() { const count = getSelectedCount(); const el = byId("vvip-counter"); el.textContent = `已選 ${count}／${LIMIT} 堂`; el.classList.toggle("full", count >= LIMIT); }
    function renderCourses() {
      const area = byId("vvip-course-area");
      const courses = filterVvipCourses(state.data ? state.data.courses : [], byId("vvip-course-search").value);
      if (!courses.length) { area.innerHTML = '<div class="state">尚無可選課程，請稍後再試或調整搜尋條件。</div>'; return; }
      const groups = groupCoursesByDate(courses);
      area.innerHTML = Object.keys(groups).sort().map((date) => `<section class="date-group"><h3 class="date-heading">${escapeHtml(date)}</h3>${groups[date].map((course) => renderCourse(course)).join("")}</section>`).join("");
    }
    function renderCourse(course) {
      const existing = state.existingCalendarIds.has(course.calendarId);
      const checked = state.selectedCalendarIds.has(course.calendarId);
      const atLimit = getSelectedCount() >= LIMIT && !checked;
      const disabled = existing || atLimit;
      const badge = existing ? '<span class="course-badge selected">已選過</span>' : atLimit && !checked ? '<span class="course-badge">已達四堂上限</span>' : '<span class="course-badge">可登記</span>';
      return `<label class="course-item"><input class="vvip-course-checkbox" type="checkbox" value="${escapeHtml(course.calendarId)}" ${checked ? "checked" : ""} ${disabled ? "disabled" : ""}><span><span class="course-time">${escapeHtml(course.time)}</span><span class="course-name">${escapeHtml(course.courseName)}</span><span class="course-teacher">${escapeHtml(course.teacherName)}</span></span>${badge}</label>`;
    }
    function renderSummary() {
      const summary = byId("vvip-summary");
      const selected = selectedCourses();
      const displayed = selected.length ? selected : (state.data.selections || []);
      summary.hidden = !state.data;
      byId("vvip-summary-copy").textContent = selected.length ? `本次新增 ${selected.length} 堂，送出後累積 ${getSelectedCount()}／${LIMIT} 堂。` : `目前累積 ${getSelectedCount()}／${LIMIT} 堂，可勾選課程後送出。`;
      byId("vvip-summary-list").innerHTML = displayed.map((course) => `<li>${escapeHtml(course.date)} ${escapeHtml(course.time)}｜${escapeHtml(course.courseName)}｜${escapeHtml(course.teacherName)}</li>`).join("") || '<li>本次尚未勾選新課程。</li>';
      byId("vvip-submit").disabled = !selected.length;
    }
    function renderWorkspace() { byId("vvip-workspace").hidden = false; byId("vvip-course-search").value = ""; renderCounter(); renderCourses(); renderSummary(); }

    async function loadVvipMembers() {
      const button = byId("vvip-lookup"); setBusy(button, true, "載入名單...");
      try {
        state.members = await callVvipApi("getVvipMembers");
        byId("vvip-member-options").innerHTML = state.members.map((member) => `<option value="${escapeHtml(member.name)}"></option>`).join("");
        if (!state.members.length) showNotice("目前尚無可用的 VVIP 名單，請聯絡教室。", "error");
      } catch (error) {
        showNotice(error.message || "暫時無法載入 VVIP 名單。", "error");
      } finally { setBusy(button, false, ""); }
    }

    async function lookupVvip(event) {
      event.preventDefault();
      const memberName = byId("vvip-member").value.trim();
      const member = state.members.find((item) => item.name === memberName);
      if (!member) return showNotice("請從名單選擇您的 OB 名稱。", "error");
      const button = byId("vvip-lookup"); setBusy(button, true, "載入中..."); clearNotice();
      try {
        const data = await callVvipApi("getVvipSelection", { vvipId: member.id });
        state.memberId = member.id; state.data = data; state.selectedCalendarIds = new Set(); state.existingCalendarIds = new Set((data.selections || []).map((item) => item.calendarId));
        renderWorkspace();
        showNotice(`已載入 ${data.month} 課程。目前已累積 ${data.count} 堂。`, "success");
      } catch (error) {
        byId("vvip-workspace").hidden = true;
        const message = /尚未開放|截止/.test(error.message || "")
          ? "本期選課尚未開放或已截止。"
          : (error.message || "暫時無法載入，請稍後重試。");
        showNotice(message, "error");
      } finally { setBusy(button, false, ""); }
    }

    function changeSelection(event) {
      const input = event.target.closest ? event.target.closest(".vvip-course-checkbox") : null;
      if (!input) return;
      if (input.checked) state.selectedCalendarIds.add(input.value); else state.selectedCalendarIds.delete(input.value);
      renderCounter(); renderCourses(); renderSummary();
    }

    async function submitVvipSelection() {
      const ids = [...state.selectedCalendarIds];
      if (!ids.length) return;
      const button = byId("vvip-submit"); setBusy(button, true, "送出中..."); clearNotice();
      try {
        const data = await callVvipApi("submitVvipSelection", { vvipId: state.memberId, calendarIds: ids });
        state.data = data; state.selectedCalendarIds = new Set(); state.existingCalendarIds = new Set((data.selections || []).map((item) => item.calendarId));
        renderWorkspace();
        showNotice(`選課意願已送出，目前累積 ${data.count}／${LIMIT} 堂。不代表正式保留名額。`, "success");
      } catch (error) {
        byId("vvip-retry").hidden = false;
        showNotice(`${error.message || "送出失敗。"} 已保留目前勾選，請重試或重新整理。`, "error");
      } finally { setBusy(button, false, ""); }
    }

    byId("vvip-member-form").addEventListener("submit", lookupVvip);
    byId("vvip-course-search").addEventListener("input", renderCourses);
    byId("vvip-course-area").addEventListener("change", changeSelection);
    byId("vvip-submit").addEventListener("click", submitVvipSelection);
    byId("vvip-retry").addEventListener("click", () => byId("vvip-member-form").requestSubmit());
    loadVvipMembers();
  </script>
</body>
</html>
