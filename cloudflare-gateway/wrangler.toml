name = "sherry-classroom-gateway"
main = "src/index.js"
compatibility_date = "2026-09-09"

[vars]
ALLOWED_ORIGINS = "https://sherryaerial-web.github.io"
TURNSTILE_HOSTNAMES = "sherryaerial-web.github.io"
ECPAY_ENVIRONMENT = "production"

[[ratelimits]]
name = "PUBLIC_WRITE_LIMITER"
namespace_id = "31001"

[ratelimits.simple]
limit = 5
period = 60

[[ratelimits]]
name = "PUBLIC_READ_LIMITER"
namespace_id = "31002"

[ratelimits.simple]
limit = 60
period = 60

[[durable_objects.bindings]]
name = "INVOICE_REQUEST_GUARD"
class_name = "InvoiceRequestGuard"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["InvoiceRequestGuard"]

[env.staging]
name = "sherry-classroom-gateway-staging"

[env.staging.vars]
ALLOWED_ORIGINS = "https://sherryaerial-web.github.io,http://127.0.0.1:4173,http://localhost:4173"
TURNSTILE_HOSTNAMES = "sherryaerial-web.github.io,localhost,127.0.0.1"
ECPAY_ENVIRONMENT = "stage"

[[env.staging.ratelimits]]
name = "PUBLIC_WRITE_LIMITER"
namespace_id = "31101"

[env.staging.ratelimits.simple]
limit = 5
period = 60

[[env.staging.ratelimits]]
name = "PUBLIC_READ_LIMITER"
namespace_id = "31102"

[env.staging.ratelimits.simple]
limit = 60
period = 60

[[env.staging.durable_objects.bindings]]
name = "INVOICE_REQUEST_GUARD"
class_name = "InvoiceRequestGuard"
