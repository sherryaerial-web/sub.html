<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sherry Aerial | 代課管理</title>
  <style>
    :root {
      --ink: #202124;
      --muted: #6f7479;
      --line: #dfe3e6;
      --surface: #ffffff;
      --soft: #f4f6f7;
      --accent: #2f5d62;
      --accent-soft: #e8f0f0;
      --warning: #9a5a13;
      --warning-soft: #fff4e5;
      --danger: #a33a32;
      --danger-soft: #fceceb;
      --success: #2e6a45;
      --radius: 8px;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      background: #eef1f2;
      color: var(--ink);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang TC",
        "Noto Sans TC", sans-serif;
      letter-spacing: 0;
    }

    button, select, input { font: inherit; }

    .app-shell {
      width: min(100%, 760px);
      min-height: 100vh;
      margin: 0 auto;
      background: var(--surface);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 10;
      display: flex;
      align-items: center;
      justify-content: space-between;
      min-height: 64px;
      padding: 12px 20px;
      background: rgba(255, 255, 255, 0.96);
      border-bottom: 1px solid var(--line);
    }

    .brand {
      min-width: 0;
    }

    .brand-name {
      margin: 0;
      font-size: 18px;
      font-weight: 700;
    }

    .brand-subtitle {
      margin-top: 2px;
      color: var(--muted);
      font-size: 13px;
    }

    .back-button {
      display: none;
      min-width: 44px;
      min-height: 40px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      cursor: pointer;
    }

    .back-button.visible { display: inline-flex; align-items: center; justify-content: center; }

    main { padding: 24px 20px 48px; }

    .view { display: none; }
    .view.active { display: block; }

    .section-heading {
      margin: 0 0 6px;
      font-size: 22px;
      line-height: 1.35;
    }

    .section-copy {
      margin: 0 0 22px;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
    }

    .home-actions {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }

    .action-button {
      min-height: 112px;
      padding: 18px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }

    .action-button:hover,
    .action-button:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }

    .action-title {
      display: block;
      margin-bottom: 8px;
      font-size: 17px;
      font-weight: 700;
    }

    .action-copy {
      display: block;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .field { margin-bottom: 20px; }

    .field label {
      display: block;
      margin-bottom: 8px;
      color: var(--ink);
      font-size: 14px;
      font-weight: 650;
    }

    select,
    .change-note-input {
      width: 100%;
      min-height: 46px;
      padding: 10px 12px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
      color: var(--ink);
    }

    select:focus,
    .change-note-input:focus {
      border-color: var(--accent);
      outline: 2px solid var(--accent-soft);
    }

    .list {
      display: grid;
      gap: 10px;
      min-height: 88px;
    }

    .list-item {
      display: grid;
      grid-template-columns: 24px minmax(0, 1fr);
      gap: 12px;
      padding: 16px;
      border: 1px solid var(--line);
      border-radius: var(--radius);
      background: var(--surface);
    }

    .list-item.is-disabled {
      opacity: 0.62;
      background: var(--soft);
    }

    .list-item input[type="checkbox"] {
      width: 20px;
      height: 20px;
      margin: 2px 0 0;
      accent-color: var(--accent);
    }

    .item-date {
      color: var(--muted);
      font-size: 13px;
    }

    .item-course {
      margin-top: 4px;
      font-size: 16px;
      font-weight: 700;
      line-height: 1.45;
      overflow-wrap: anywhere;
    }

    .item-meta {
      margin-top: 5px;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .category-tag {
      display: inline-block;
      margin-top: 8px;
      padding: 3px 7px;
      border-radius: 4px;
      background: var(--accent-soft);
      color: var(--accent);
      font-size: 12px;
      font-weight: 700;
    }

    .change-note {
      grid-column: 2;
      margin-top: 4px;
      padding: 12px;
      border-left: 3px solid var(--warning);
      background: var(--warning-soft);
    }

    .change-note label {
      display: block;
      margin-bottom: 7px;
      color: var(--warning);
      font-size: 13px;
      font-weight: 700;
    }

    .hint {
      margin-top: 6px;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.45;
    }

    .primary-button {
      width: 100%;
      min-height: 50px;
      margin-top: 20px;
      border: 0;
      border-radius: var(--radius);
      background: var(--accent);
      color: #ffffff;
      font-weight: 700;
      cursor: pointer;
    }

    .primary-button:disabled {
      background: #aeb8ba;
      cursor: not-allowed;
    }

    .state {
      padding: 24px 16px;
      border: 1px dashed var(--line);
      border-radius: var(--radius);
      color: var(--muted);
      text-align: center;
      font-size: 14px;
      line-height: 1.6;
    }

    .state.error {
      border-style: solid;
      border-color: #efc3bf;
      background: var(--danger-soft);
      color: var(--danger);
    }

    .notice {
      display: none;
      margin-bottom: 18px;
      padding: 12px 14px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.5;
    }

    .notice.visible { display: block; }
    .notice.success { background: #eaf5ee; color: var(--success); }
    .notice.error { background: var(--danger-soft); color: var(--danger); }

    @media (max-width: 640px) {
      .app-shell { border: 0; }
      .topbar { padding: 10px 16px; }
      main { padding: 20px 16px 40px; }
      .home-actions { grid-template-columns: 1fr; }
      .action-button { min-height: 92px; }
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <h1 class="brand-name">Sherry Aerial Studio</h1>
        <div class="brand-subtitle">代課管理</div>
      </div>
      <button id="back-button" class="back-button" type="button" aria-label="返回首頁">返回</button>
    </header>

    <main>
      <div id="notice" class="notice" role="status" aria-live="polite"></div>

      <section id="view-home" class="view active">
        <h2 class="section-heading">今天要處理什麼？</h2>
        <p class="section-copy">請選擇功能，課程會依最新同步資料顯示。</p>
        <div class="home-actions">
          <button class="action-button" type="button" data-view="view-leave">
            <span class="action-title">請假登記</span>
            <span class="action-copy">選擇自己的課程並送出代課需求。</span>
          </button>
          <button class="action-button" type="button" data-view="view-claim">
            <span class="action-title">尋找與領取代課</span>
            <span class="action-copy">查看待領取課程，跨類代課時填寫改課內容。</span>
          </button>
          <button class="action-button" type="button" data-view="view-mysubs">
            <span class="action-title">查看我的代課紀錄</span>
            <span class="action-copy">查詢已領取課程與改課備註。</span>
          </button>
        </div>
      </section>

      <section id="view-leave" class="view">
        <h2 class="section-heading">請假登記</h2>
        <p class="section-copy">選擇姓名後，勾選需要尋找代課的課程。</p>
        <div class="field">
          <label for="leave-teacher-select">請假老師</label>
          <select id="leave-teacher-select">
            <option value="">載入中...</option>
          </select>
        </div>
        <div id="leave-course-list" class="list">
          <div class="state">請先選擇老師</div>
        </div>
        <button id="leave-submit" class="primary-button" type="button">送出請假申請</button>
      </section>

      <section id="view-claim" class="view">
        <h2 class="section-heading">領取代課</h2>
        <p class="section-copy">選擇您的姓名。若代課種類不是平常教授的大類，請填寫要改成的課程。</p>
        <div class="field">
          <label for="claim-teacher-select">代課老師</label>
          <select id="claim-teacher-select">
            <option value="">載入中...</option>
          </select>
        </div>
        <div id="pending-leaves-list" class="list">
          <div class="state">載入中...</div>
        </div>
        <button id="claim-submit" class="primary-button" type="button">確認領取勾選課程</button>
      </section>

      <section id="view-mysubs" class="view">
        <h2 class="section-heading">我的代課紀錄</h2>
        <p class="section-copy">選擇姓名查看已領取課程與改課內容。</p>
        <div class="field">
          <label for="mysub-teacher-select">查詢老師</label>
          <select id="mysub-teacher-select">
            <option value="">載入中...</option>
          </select>
        </div>
        <div id="my-subs-list" class="list">
          <div class="state">請先選擇老師</div>
        </div>
      </section>
    </main>
  </div>

  <script>
    const APP_URL = "https://script.google.com/macros/s/AKfycbyJADHe_DZdNIbfv_KPewAcBekEond-5Fw63i-RWCd1mHl_O9uGAQ-LTnzENZshjnhe/exec";

    let globalCourseList = [];
    let pendingLeaves = [];

    const byId = (id) => document.getElementById(id);

    async function callApi(action, params = {}) {
      const query = new URLSearchParams({ action });
      Object.entries(params).forEach(([key, value]) => {
        query.set(key, typeof value === "string" ? value : JSON.stringify(value));
      });

      const response = await fetch(`${APP_URL}?${query.toString()}`, {
        method: "GET",
        redirect: "follow",
        cache: "no-store"
      });
      if (!response.ok) {
        throw new Error(`系統連線失敗（HTTP ${response.status}）`);
      }

      const payload = await response.json();
      if (!payload || payload.status !== "success") {
        if (payload && payload.message) throw new Error(payload.message);
        throw new Error("系統回覆格式錯誤。");
      }
      return payload.data;
    }

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replaceAll("&", "&amp;")
        .replaceAll("<", "&lt;")
        .replaceAll(">", "&gt;")
        .replaceAll('"', "&quot;")
        .replaceAll("'", "&#39;");
    }

    function normalizeCourseName(value) {
      return String(value || "").replace(/\s+/g, "").toLowerCase();
    }

    function getCourseCategory(courseName) {
      const name = normalizeCourseName(courseName);
      if (/空中?瑜伽|空瑜/.test(name)) return "空瑜";
      if (/空環/.test(name)) return "空環";
      if (/舞綢/.test(name)) return "舞綢";
      if (/柔軟度|柔軟開發/.test(name)) return "柔軟度";
      if (/綢吊/.test(name)) return "綢吊";
      if (/瑜伽/.test(name)) return "瑜伽";
      return "其他";
    }

    function requiresChangeNote(teacherName, targetCourseName) {
      const teacherCourses = globalCourseList
        .filter((item) => item["指導者"] === teacherName)
        .map((item) => normalizeCourseName(item["課程"]));
      const targetName = normalizeCourseName(targetCourseName);
      const targetCategory = getCourseCategory(targetName);

      if (targetCategory === "其他") {
        return !teacherCourses.includes(targetName);
      }
      return !teacherCourses.some((name) => getCourseCategory(name) === targetCategory);
    }

    function setNotice(message, type = "success") {
      const notice = byId("notice");
      notice.textContent = message;
      notice.className = `notice visible ${type}`;
      window.scrollTo({ top: 0, behavior: "smooth" });
    }

    function clearNotice() {
      const notice = byId("notice");
      notice.textContent = "";
      notice.className = "notice";
    }

    function setButtonBusy(button, busy, busyText) {
      if (!button.dataset.defaultText) button.dataset.defaultText = button.textContent;
      button.disabled = busy;
      button.textContent = busy ? busyText : button.dataset.defaultText;
    }

    function switchView(viewId) {
      clearNotice();
      document.querySelectorAll(".view").forEach((view) => {
        view.classList.toggle("active", view.id === viewId);
      });
      byId("back-button").classList.toggle("visible", viewId !== "view-home");

      if (viewId === "view-claim") {
        fetchPendingLeaves();
      }
      if (viewId === "view-mysubs") {
        byId("mysub-teacher-select").value = "";
        byId("my-subs-list").innerHTML = '<div class="state">請先選擇老師</div>';
      }
    }

    function buildTeacherOptions(teachers) {
      const names = [...new Set(
        teachers.map((item) => item["指導者"]).filter(Boolean)
      )];
      const options = [
        '<option value="">請選擇...</option>',
        ...names.map((name) => `<option value="${escapeHtml(name)}">${escapeHtml(name)}</option>`)
      ].join("");
      ["leave-teacher-select", "claim-teacher-select", "mysub-teacher-select"]
        .forEach((id) => { byId(id).innerHTML = options; });
    }

    async function initialize() {
      try {
        const [teachers, courses] = await Promise.all([
          callApi("getTeachers"),
          callApi("getCourseList")
        ]);
        globalCourseList = courses;
        buildTeacherOptions(teachers);
      } catch (error) {
        setNotice(error.message, "error");
        ["leave-teacher-select", "claim-teacher-select", "mysub-teacher-select"]
          .forEach((id) => {
            byId(id).innerHTML = '<option value="">載入失敗</option>';
          });
      }
    }

    function renderTeacherCourses() {
      const teacher = byId("leave-teacher-select").value;
      const list = byId("leave-course-list");
      if (!teacher) {
        list.innerHTML = '<div class="state">請先選擇老師</div>';
        return;
      }

      const courses = globalCourseList
        .filter((item) => item["指導者"] === teacher)
        .sort((a, b) => `${a["日期"]} ${a["時間"]}`.localeCompare(`${b["日期"]} ${b["時間"]}`));
      if (!courses.length) {
        list.innerHTML = '<div class="state">目前沒有可登記的課程</div>';
        return;
      }

      list.innerHTML = courses.map((item, index) => `
        <label class="list-item">
          <input type="checkbox" class="leave-checkbox" data-course-index="${index}">
          <span>
            <span class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時間"])}</span>
            <span class="item-course">${escapeHtml(item["課程"])}</span>
            <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
          </span>
        </label>
      `).join("");
      list.dataset.courses = JSON.stringify(courses);
    }

    async function submitLeave() {
      const teacher = byId("leave-teacher-select").value;
      const checked = [...document.querySelectorAll(".leave-checkbox:checked")];
      if (!teacher) return setNotice("請先選擇請假老師。", "error");
      if (!checked.length) return setNotice("請至少勾選一堂請假課程。", "error");

      const courses = JSON.parse(byId("leave-course-list").dataset.courses || "[]");
      const items = checked.map((checkbox) => courses[Number(checkbox.dataset.courseIndex)]);
      const button = byId("leave-submit");
      clearNotice();
      setButtonBusy(button, true, "正在送出...");
      try {
        await callApi("submitLeave", { instructor: teacher, items });
        setNotice("請假登記成功，課程已加入待領取清單。");
        switchView("view-home");
        setNotice("請假登記成功，課程已加入待領取清單。");
      } catch (error) {
        setNotice(error.message, "error");
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    async function fetchPendingLeaves() {
      const list = byId("pending-leaves-list");
      list.innerHTML = '<div class="state">載入中...</div>';
      try {
        pendingLeaves = await callApi("getPendingLeaves");
        pendingLeaves.sort((a, b) => {
          return `${a["日期"]} ${a["時段"]} ${a["原老師"]}`
            .localeCompare(`${b["日期"]} ${b["時段"]} ${b["原老師"]}`);
        });
        renderPendingLeaves();
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    function renderPendingLeaves() {
      const list = byId("pending-leaves-list");
      const teacher = byId("claim-teacher-select").value;
      if (!pendingLeaves.length) {
        list.innerHTML = '<div class="state">目前沒有待領取代課</div>';
        return;
      }

      list.innerHTML = pendingLeaves.map((item) => {
        const substituteId = item["代課編號"];
        const isOwnCourse = teacher && teacher === item["原老師"];
        const noteRequired = teacher && requiresChangeNote(teacher, item["課程"]);
        return `
          <div class="list-item ${isOwnCourse ? "is-disabled" : ""}">
            <input
              type="checkbox"
              class="claim-checkbox"
              data-substitute-id="${escapeHtml(substituteId)}"
              ${!teacher || isOwnCourse ? "disabled" : ""}
            >
            <div>
              <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
              <div class="item-course">${escapeHtml(item["課程"])}</div>
              <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
              <span class="category-tag">${escapeHtml(item["課程大類"] || getCourseCategory(item["課程"]))}</span>
              ${isOwnCourse ? '<div class="item-meta">不可領取自己的課程</div>' : ""}
            </div>
            ${noteRequired ? `
              <div class="change-note">
                <label for="note-${escapeHtml(substituteId)}">改成什麼課（必填）</label>
                <input
                  id="note-${escapeHtml(substituteId)}"
                  class="change-note-input"
                  type="text"
                  maxlength="80"
                  data-note-for="${escapeHtml(substituteId)}"
                  placeholder="例如：空環 Lv.1"
                >
                <div class="hint">這堂課不屬於您目前排課的大類。</div>
              </div>
            ` : ""}
          </div>
        `;
      }).join("");
    }

    async function submitClaim() {
      const teacher = byId("claim-teacher-select").value;
      const checked = [...document.querySelectorAll(".claim-checkbox:checked")];
      if (!teacher) return setNotice("請先選擇代課老師。", "error");
      if (!checked.length) return setNotice("請至少勾選一堂代課課程。", "error");

      const items = [];
      for (const checkbox of checked) {
        const substituteId = checkbox.dataset.substituteId;
        const noteInput = document.querySelector(`[data-note-for="${CSS.escape(substituteId)}"]`);
        const changeNote = noteInput ? noteInput.value.trim() : "";
        if (noteInput && !changeNote) {
          noteInput.focus();
          return setNotice("跨課程種類代課時，請填寫要改成什麼課。", "error");
        }
        items.push({ substituteId, changeNote });
      }

      const button = byId("claim-submit");
      clearNotice();
      setButtonBusy(button, true, "正在領取...");
      try {
        await callApi("submitClaim", { subTeacher: teacher, items });
        setNotice("代課領取成功。");
        await fetchPendingLeaves();
      } catch (error) {
        setNotice(error.message, "error");
        if (/已被其他老師領取|重新整理/.test(error.message)) {
          await fetchPendingLeaves();
        }
      } finally {
        setButtonBusy(button, false, "");
      }
    }

    async function fetchMySubs() {
      const teacher = byId("mysub-teacher-select").value;
      const list = byId("my-subs-list");
      if (!teacher) {
        list.innerHTML = '<div class="state">請先選擇老師</div>';
        return;
      }

      list.innerHTML = '<div class="state">查詢中...</div>';
      try {
        const items = await callApi("getMySubs", { name: teacher });
        if (!items.length) {
          list.innerHTML = '<div class="state">目前沒有代課紀錄</div>';
          return;
        }
        list.innerHTML = items.map((item) => `
          <article class="list-item" style="grid-template-columns: 1fr;">
            <div>
              <div class="item-date">${escapeHtml(item["日期"])} ${escapeHtml(item["時段"])}</div>
              <div class="item-course">${escapeHtml(item["課程"])}</div>
              <div class="item-meta">原老師：${escapeHtml(item["原老師"])}</div>
              ${item["備註"] ? `<div class="item-meta">改課：${escapeHtml(item["備註"])}</div>` : ""}
            </div>
          </article>
        `).join("");
      } catch (error) {
        list.innerHTML = `<div class="state error">${escapeHtml(error.message)}</div>`;
      }
    }

    document.querySelectorAll("[data-view]").forEach((button) => {
      button.addEventListener("click", () => switchView(button.dataset.view));
    });
    byId("back-button").addEventListener("click", () => switchView("view-home"));
    byId("leave-teacher-select").addEventListener("change", renderTeacherCourses);
    byId("claim-teacher-select").addEventListener("change", renderPendingLeaves);
    byId("mysub-teacher-select").addEventListener("change", fetchMySubs);
    byId("leave-submit").addEventListener("click", submitLeave);
    byId("claim-submit").addEventListener("click", submitClaim);

    initialize();
  </script>
</body>
</html>
